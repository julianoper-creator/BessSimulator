<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Simulador Estratégico · Energy Arb + Storage + Gen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'IBM Plex Sans', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">



const { useState, useMemo, useCallback, useRef, useEffect } = React;

// ═══════════════════════════════════════════════════════════
// PALETA
// ═══════════════════════════════════════════════════════════
const C = {
  bg:"#07090c", surface:"#0c1117", card:"#111820", border:"#1a2535",
  accent:"#3dd9eb", gold:"#f5c842", green:"#2ecc71", red:"#e74c3c",
  amber:"#f39c12", violet:"#9b59b6", blue:"#3498db", teal:"#1abc9c",
  text:"#d8e8f0", sub:"#7a9ab0", muted:"#3a5568", dim:"#1e303f",
};
const CORES = [C.muted, C.accent, C.gold, C.green, C.violet];

// ═══════════════════════════════════════════════════════════
// PERFIS HORÁRIOS
// ═══════════════════════════════════════════════════════════
const PERFIL_SOLAR = [0,0,0,0,0,0,0.05,0.18,0.42,0.65,0.82,0.92,0.95,0.90,0.80,0.62,0.38,0.15,0.03,0,0,0,0,0];
// Perfil dia útil (referência 1.0 = pico)
const PERFIL_DU   = [0.62,0.60,0.58,0.57,0.58,0.62,0.70,0.82,0.92,0.97,1.00,0.99,0.96,0.98,0.99,0.98,0.95,0.90,0.80,0.72,0.70,0.68,0.65,0.63];
// Perfil fim de semana: carga ~20-30% menor, sem pico industrial, sem ponta tarifária
const PERFIL_FDS  = [0.45,0.43,0.41,0.40,0.40,0.42,0.48,0.55,0.62,0.68,0.72,0.74,0.73,0.72,0.70,0.68,0.65,0.62,0.60,0.57,0.55,0.52,0.50,0.47];
const HORAS_PONTA = [18,19,20]; // ponta ANEEL padrão — só dias úteis

// ═══════════════════════════════════════════════════════════
// CALENDÁRIO MENSAL — dias úteis vs fins de semana
// ═══════════════════════════════════════════════════════════
// Gera o calendário do mês corrente distinguindo DU e FDS
// Retorna { diasUteis, diasFds, horasPontaMes, horasFPDU, horasFPFDS }
function calcularCalendarioMes(ano, mes) {
  // mes: 0-based (Date padrão JS)
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  let diasUteis = 0, diasFds = 0;
  for (let d = 1; d <= diasNoMes; d++) {
    const dow = new Date(ano, mes, d).getDay(); // 0=dom, 6=sab
    if (dow === 0 || dow === 6) diasFds++;
    else diasUteis++;
  }
  // Horas de ponta no mês: 3h/dia × dias úteis (ANEEL: ponta não existe em FDS/feriados)
  const horasPontaMes    = HORAS_PONTA.length * diasUteis;
  // Horas fora ponta: (24-3)h × dias úteis + 24h × dias FDS
  const horasFPDU        = (24 - HORAS_PONTA.length) * diasUteis;
  const horasFPFDS       = 24 * diasFds;
  const horasFPMes       = horasFPDU + horasFPFDS;
  const horasTotalMes    = 24 * diasNoMes;
  return { diasUteis, diasFds, diasNoMes, horasPontaMes, horasFPDU, horasFPFDS, horasFPMes, horasTotalMes };
}

// ═══════════════════════════════════════════════════════════
// DISTRIBUIDORAS
// ═══════════════════════════════════════════════════════════
const DISTRIBUIDORAS = [
  "CPFL Paulista","CPFL Piratininga","Elektro","EDP SP","ENEL SP","ENERGISA SP",
  "CEMIG-D","COPEL-DIS","CELESC-DIS","COELBA","COSERN","CELPE","ENERGISA MT",
  "ENERGISA MS","ENERGISA TO","ENERGISA PB","ENERGISA SE","LIGHT","ENEL RJ",
  "AMPLA","CELG-D","CERON","ELETROACRE","RORAIMA","AMAZONAS ENERGIA",
  "CELPA","EDP ES","ESCELSA","COELCE","CEAL","CEPISA","ENEVA",
];

// ═══════════════════════════════════════════════════════════
// MOTOR DE SIMULAÇÃO — considera dia útil E fim de semana
// ═══════════════════════════════════════════════════════════
// A simulação roda dois "dias tipo" por mês:
//   • Dia Útil  (DU): tem ponta tarifária 18-21h, carga plena
//   • Fim de Semana (FDS): sem ponta tarifária, carga reduzida, PLD menor
// Os resultados são ponderados pelo calendário real do mês.
//
// pldPonta    = PLD médio nas horas 18-21h de dias ÚTEIS (R$/MWh)
// pldFPDU     = PLD médio nas horas fora ponta de dias ÚTEIS (R$/MWh)
// pldFDS      = PLD médio em TODOS os fins de semana (costuma ser pldFPDU × 0.85)
function simularMes({ cargaMedia, potenciaGeracao, tipoGeracao, bess, tarifas, modalidade,
                       demandaFP, demandaP, pldPonta=95, pldFPDU=85, pldFDS=75,
                       demMedidaMediaP=null, demMedidaMediaFP=null,
                       modoDespacho="corte_ultrap" }) {
  // modoDespacho:
  //   "corte_ultrap"  → BESS cobre só o excedente acima da demanda contratada (padrão)
  //   "zerar_ponta"   → BESS cobre TODO o consumo de ponta (rede = 0 nas horas 18-21h)
  // demMedidaMediaP / demMedidaMediaFP: média histórica da demanda MEDIDA (MW)
  // Quando fornecida, substitui o pico sintético (maxP_mes/maxFP_mes) no cálculo
  // de custo de demanda e multa — mais preciso que o perfil horário estimado.
  const { te_fp, te_p, tusd_fp, tusd_p, dem_fp, dem_p, dem_unico,
          temContratoACL, precoACL, volumeACL } = tarifas;
  const isAzul = modalidade === "azul";

  // ── Preço de energia por posto ───────────────────────────
  // SEM contrato ACL: TE = PLD do posto (horário real) + TUSD
  // COM contrato ACL: TE = preço bilateral + TUSD (igual P e FP)
  // Em ambos os casos, a TUSD é sempre devida (componente de rede).
  const pFP = temContratoACL
    ? (precoACL||0) + (tusd_fp||0)          // contrato fixo + TUSD FP
    : (pldFPDU||0)  + (tusd_fp||0);         // PLD fora ponta DU + TUSD FP
  const pP = temContratoACL
    ? (precoACL||0) + (tusd_p||0)           // contrato fixo + TUSD P
    : (pldPonta||0) + (tusd_p||0);          // PLD ponta + TUSD P
  const pFDS = temContratoACL
    ? (precoACL||0) + (tusd_fp||0)
    : (pldFDS||0)   + (tusd_fp||0);         // PLD FDS + TUSD FP
  const ef       = bess.eficiencia || BESS_MODULO.eficiencia;
  // Capacidade já é líquida (sem reserva de segurança) — SOC operacional 0–100%
  const socMax   = 100;
  const socMin   = 0;
  const bessPot    = bess.potencia   || 0; // MW
  const bessCapMWh = bess.capacidade || 0; // MWh líquido

  // Demandas contratadas em MW (inputs já em MW)
  const demContrP  = demandaP  || 0;  // MW — ponta  (Azul)
  const demContrFP = demandaFP || 0;  // MW — fora ponta (Azul) ou única (Verde)

  const agora = new Date();
  const cal = calcularCalendarioMes(agora.getFullYear(), agora.getMonth());

  // ── Fatores de escalonamento do perfil (nível simularMes) ─
  // Calculados uma vez e reutilizados por simDia DU e FDS
  // Garante que a energia ACL use os mesmos fatores do perfil simulado
  let fatorP  = 1.0;
  let fatorFP = 1.0;
  if (demMedidaMediaP || demMedidaMediaFP) {
    const mediaPerfilP  = HORAS_PONTA.reduce((s,h)=>s+PERFIL_DU[h],0) / HORAS_PONTA.length;
    const horasFP_arr   = Array.from({length:24},(_,h)=>h).filter(h=>!HORAS_PONTA.includes(h));
    const mediaPerfilFP = horasFP_arr.reduce((s,h)=>s+PERFIL_DU[h],0) / horasFP_arr.length;
    if (demMedidaMediaP  && mediaPerfilP  > 0) fatorP  = demMedidaMediaP  / (cargaMedia * mediaPerfilP);
    if (demMedidaMediaFP && mediaPerfilFP > 0) fatorFP = demMedidaMediaFP / (cargaMedia * mediaPerfilFP);
  }

  // ─────────────────────────────────────────────────────────
  // ESTRATÉGIA DE DESPACHO DO BESS — corrigida
  // ─────────────────────────────────────────────────────────
  // FASE 1 — Pré-carga (horas antes da ponta):
  //   Carrega o BESS até capacidade máxima para garantir energia disponível na ponta.
  //   Prioridade: excesso de geração própria → rede fora ponta.
  //
  // FASE 2 — Descarga na ponta (18-21h DU):
  //   Objetivo primário: reduzir demanda líquida até a demanda contratada.
  //   Se demanda_bruta > demanda_contratada → descarrega o excedente.
  //   Limitado por: potência do BESS, SOC disponível, demanda contratada como piso.
  //   Objetivo secundário: maximizar energia descarregada (arbitragem PLD) até esgotar SOC.
  //
  // FASE 3 — Recarga pós-ponta (horas após 21h):
  //   Recarrega para ciclo do dia seguinte.

  function simDia(tipoDia) {
    const ehFDS = tipoDia === "fds";
    const perfil = ehFDS ? PERFIL_FDS : PERFIL_DU;
    const temPonta = h => !ehFDS && HORAS_PONTA.includes(h);

    // fatorP e fatorFP são calculados em nível de simularMes (escopo externo)
    // e reutilizados aqui para o perfil de cada dia

    // Pré-calcular carga de cada hora com escalonamento por posto
    const cargaHoras = Array.from({length:24}, (_,h) => {
      const ehPontaH = !ehFDS && HORAS_PONTA.includes(h);
      return cargaMedia * perfil[h] * (ehPontaH ? fatorP : fatorFP);
    });

    // Energia necessária na ponta para atender a estratégia de corte de demanda
    // Em cada hora de ponta: descarregar max(0, carga - geracao - demContratada)
    // Precisamos saber quanto BESS precisa ter carregado antes das 18h
    let energiaNecessariaPonta = 0;
    if (!ehFDS && bessCapMWh > 0) {
      for (const h of HORAS_PONTA) {
        const cargaH = cargaHoras[h];
        const gerH = tipoGeracao==="solar" ? potenciaGeracao*PERFIL_SOLAR[h]
                   : tipoGeracao==="eolica" ? potenciaGeracao*Math.max(0,0.3+Math.sin(h*0.5)*0.2)
                   : tipoGeracao==="termica" ? potenciaGeracao*0.85 : 0;
        // Quanto preciso descarregar para manter demanda ≤ demContratadaP (Azul) ou ≤ demContratadaFP (Verde)
        const limDem = isAzul ? demContrP : demContrFP;
        const excedente = Math.max(0, (cargaH - gerH) - limDem);
        energiaNecessariaPonta += Math.min(excedente, bessPot); // limitado pela potência
      }
    }
    // SOC alvo antes da ponta: suficiente para cobrir toda a ponta + reserva
    const socAlvoPonta = bessCapMWh > 0
      ? Math.min(socMax, ((energiaNecessariaPonta / ef) / bessCapMWh) * 100 + socMin)
      : 0;

    let soc = bessCapMWh * (bess.socInicial||50) / 100;
    let eFP=0, eP=0, eGer=0, eArb=0, maxFP=0, maxP=0, maxGlob=0, descT=0;
    const horas = [];

    // ── Pré-calcular plano de despacho para as horas de ponta ──────────
    // USA socAlvoPonta como SOC de entrada na ponta — é o SOC que o BESS terá
    // após a pré-carga nas horas 14-17h. Não usa soc inicial (50%) que é muito menor.
    const despachoPlano = {};
    if (!ehFDS && bessCapMWh > 0) {
      const limDemP = isAzul ? demContrP : demContrFP;
      // Simula a pré-carga (14-17h) para saber o SOC REAL ao entrar na ponta
      // Usa os mesmos parâmetros do loop principal para consistência
      let socSimPre = soc; // começa no soc inicial do dia
      for (let hpre = 0; hpre < HORAS_PONTA[0]; hpre++) {
        const ehPontaH = HORAS_PONTA.includes(hpre);
        if (!ehPontaH && socSimPre < bessCapMWh * socAlvoPonta / 100) {
          const necessidade = bessCapMWh * socAlvoPonta / 100 - socSimPre;
          const cargaRede = Math.min(bessPot * 0.8, necessidade, bessCapMWh - socSimPre);
          socSimPre = Math.min(bessCapMWh, socSimPre + cargaRede * ef);
        }
      }
      // SOC real ao entrar na ponta (após pré-carga simulada)
      let socDisp = Math.min(socSimPre, bessCapMWh);

      // 1ª passagem: aloca descarga por hora de ponta
      // corte_ultrap: cobre só excedente acima do contratado
      // zerar_ponta:  cobre toda a carga líquida (rede = 0)
      const alocado = {};
      for (const hp of HORAS_PONTA) {
        const cargaHp = cargaHoras[hp];
        const gerHp   = tipoGeracao==="solar"   ? potenciaGeracao*PERFIL_SOLAR[hp]
                      : tipoGeracao==="eolica"  ? potenciaGeracao*Math.max(0,0.3+Math.sin(hp*0.5)*0.2)
                      : tipoGeracao==="termica" ? potenciaGeracao*0.85 : 0;
        const demLiq  = Math.max(0, cargaHp - gerHp);
        const corteNec = modoDespacho === "zerar_ponta"
          ? demLiq                              // zera 100% do consumo de ponta
          : Math.max(0, demLiq - limDemP);      // cobre só ultrapassagem
        const desp = Math.min(corteNec, bessPot, socDisp);
        alocado[hp] = desp;
        socDisp = Math.max(0, socDisp - desp / ef);
      }
      // 2ª passagem: distribui SOC restante como arbitragem extra
      for (const hp of HORAS_PONTA) {
        const extra = Math.min(bessPot - alocado[hp], socDisp);
        if (extra > 0) { alocado[hp] += extra; socDisp = Math.max(0, socDisp - extra / ef); }
      }
      Object.assign(despachoPlano, alocado);
    }

    for (let h = 0; h < 24; h++) {
      const ehP = temPonta(h);
      const cargaH = cargaHoras[h];
      let gerH = 0;
      if (tipoGeracao==="solar") gerH = potenciaGeracao * PERFIL_SOLAR[h];
      else if (tipoGeracao==="eolica") gerH = potenciaGeracao * Math.max(0, 0.3+Math.sin(h*0.5)*0.2);
      else if (tipoGeracao==="termica") gerH = potenciaGeracao * 0.85;
      eGer += gerH;

      let cB=0, dB=0;
      const socPct = bessCapMWh > 0 ? (soc/bessCapMWh)*100 : 0;
      const socDispMWh = bessCapMWh * Math.max(0, socPct - socMin) / 100;
      const socEspMWh  = bessCapMWh * Math.max(0, socMax - socPct) / 100;

      if (bessCapMWh > 0) {
        if (ehP) {
          // ── PONTA (DU apenas): descarga pelo plano pré-calculado ──
          // despachoPlano[h] foi calculado ANTES do loop com o SOC inicial real,
          // garantindo que cada hora receba exatamente o corte necessário.
          const dBplanejado = despachoPlano[h] || 0;
          dB = Math.min(dBplanejado, socDispMWh, bessPot);
          dB = Math.max(0, dB);
          soc -= dB / ef;
          descT += dB;
          eArb  += dB;

        } else {
          // ── FORA PONTA: carga estratégica ───────────────────
          const exc = gerH - cargaH; // excesso de geração

          // Prioridade 1: absorver excesso de geração própria
          if (exc > 0 && socPct < socMax) {
            cB = Math.min(exc, bessPot, socEspMWh);
            soc += cB * ef;
          }

          // Prioridade 2: pré-carregar da rede para garantir energia na ponta
          // Mais agressivo nas horas antes da ponta (14-17h) e pós-ponta (21-23h)
          const preCarregando = !ehFDS && (h >= 14 && h <= 17);
          const posCarregando = !ehFDS && (h >= 21 && h <= 23);
          const ehFDSCarregar = ehFDS;

          if ((preCarregando || posCarregando || ehFDSCarregar) && socPct < socAlvoPonta) {
            const necessidade = bessCapMWh * (socAlvoPonta - socPct) / 100;
            const cargaRede = Math.min(bessPot * 0.8, necessidade, socEspMWh);
            if (cargaRede > 0 && cargaRede > cB) {
              const cargaExtra = cargaRede - cB;
              soc += cargaExtra * ef;
              cB += cargaExtra;
              // Custo de recarga (paga pFP pela energia de rede)
              // recarga custo incluso via pFP na energia
            }
          } else if (socPct < socMin + 15 && socEspMWh > 0) {
            // Carga mínima de segurança
            const cargaSeg = Math.min(bessPot * 0.3, socEspMWh);
            if (cargaSeg > cB) {
              soc += (cargaSeg - cB) * ef;
              cB = cargaSeg;
            }
          }
        }
      }

      const dRede = Math.max(0, cargaH - gerH - dB + cB);
      maxGlob = Math.max(maxGlob, dRede);
      if (ehP) { eP += dRede; maxP = Math.max(maxP, dRede); }
      else      { eFP += dRede; maxFP = Math.max(maxFP, dRede); }
      horas.push({ h, ehP, ehFDS, cargaH, gerH, cB, dB, dRede,
        socPct: bessCapMWh>0?(soc/bessCapMWh)*100:0,
        demContratada: ehP ? (isAzul?demContrP:demContrFP) : demContrFP,
        ultrapassagem: ehP ? Math.max(0,dRede-(isAzul?demContrP:demContrFP)) : Math.max(0,dRede-demContrFP),
      });
    }
    return { horas, eFP, eP, eGer, eArb, maxFP, maxP, maxGlob, descT,
             energiaNecessariaPonta, socAlvoPonta };
  }

  const du  = simDia("du");
  const fds = simDia("fds");

  // ── Agregação mensal ─────────────────────────────────────
  const eFP_mes   = du.eFP  * cal.diasUteis + fds.eFP  * cal.diasFds;
  const eP_mes    = du.eP   * cal.diasUteis;
  const eGer_mes  = du.eGer * cal.diasUteis + fds.eGer * cal.diasFds;
  const eArb_mes  = du.eArb * cal.diasUteis;
  const maxFP_mes     = Math.max(du.maxFP, fds.maxFP);
  const maxP_mes      = du.maxP;
  const maxGlobal_mes = Math.max(du.maxGlob, fds.maxGlob);
  const ciclosMes = (du.descT * cal.diasUteis + fds.descT * cal.diasFds) / Math.max(1, bessCapMWh);

  // ── Custo de energia TUSD+TE ─────────────────────────────
  // Energia separada por posto para aplicar preço correto de cada período
  const eFP_DU_mes  = du.eFP  * cal.diasUteis;   // MWh fora ponta DU (rede líquida)
  const eFP_FDS_mes = fds.eFP * cal.diasFds;      // MWh fim de semana (rede líquida)

  // ── Custo de energia: ACL vs Spot ────────────────────────
  // SPOT: paga sobre energia líquida da rede (BESS/solar reduzem o que compra da rede)
  // ACL:  energia é FIXA — calculada sobre a carga bruta da UC ANTES de qualquer BESS/solar
  //       O medidor da distribuidora está na entrada da UC: BESS e solar ficam internos.
  //       Por isso a energia ACL é IDÊNTICA em todos os cenários.
  //       O ganho do BESS no ACL é EXCLUSIVAMENTE via demanda e multa.

  // Energia bruta por posto: calculada direto do perfil × fator (sem loop de simulação)
  // Usa os mesmos fatores de escalonamento (fatorP, fatorFP) do simDia,
  // mas sem o efeito de BESS (cB/dB) e sem geração solar (gerH)
  const simDuBruto = (() => {
    let efp=0, ep=0;
    for (let h=0; h<24; h++) {
      const ehPontaH = HORAS_PONTA.includes(h);
      const cargaBruta = cargaMedia * PERFIL_DU[h] * (ehPontaH ? fatorP : fatorFP);
      if (ehPontaH) ep  += cargaBruta;
      else          efp += cargaBruta;
    }
    return { efp, ep };
  })();
  const simFdsBruto = (() => {
    let efp=0;
    for (let h=0; h<24; h++) {
      efp += cargaMedia * PERFIL_FDS[h] * fatorFP;
    }
    return { efp };
  })();

  const eBruta_FP_DU = simDuBruto.efp  * cal.diasUteis;  // MWh — carga bruta FP dias úteis
  const eBruta_P_DU  = simDuBruto.ep   * cal.diasUteis;  // MWh — carga bruta Ponta dias úteis
  const eBruta_FDS   = simFdsBruto.efp * cal.diasFds;    // MWh — carga bruta FDS

  // temContratoACL and precoACL already destructured from tarifas above
  // Geração solar no mês (apenas solar — térmica/eólica tratadas diferente)
  // Solar injetada na UC reduz a medição da distribuidora → reduz energia faturada
  const eGerSolar_mes = tipoGeracao === "solar" ? eGer_mes : 0;

  let custoEnergia;
  if (temContratoACL) {
    const te = precoACL || 0;
    // ACL + BESS (sem solar): energia IGUAL ao Cenário Base — BESS não altera medição
    // ACL + Solar: solar reduz energia MEDIDA → reduz custo de TE
    // Energia líquida ACL = carga bruta − geração solar (≥0)
    const eLiqACL_FP = Math.max(0, eBruta_FP_DU + eBruta_FDS - eGerSolar_mes);
    const eLiqACL_P  = eBruta_P_DU; // solar não gera na ponta (18-21h) — negligível
    custoEnergia = eLiqACL_FP * (te + (tusd_fp||0))
                 + eLiqACL_P  * (te + (tusd_p ||0));
  } else {
    // SPOT: PLD+TUSD sobre energia LÍQUIDA da rede (BESS e solar reduzem consumo)
    custoEnergia = (eFP_DU_mes * pFP + eP_mes * pP + eFP_FDS_mes * pFDS);
  }

  // ── Custo de demanda + multa ──────────────────────────────
  // demMedidaMediaP/FP calibram o perfil via fatorP/fatorFP (já aplicado no cargaHoras)
  // O maxP_mes / maxFP_mes JÁ reflete a demanda real histórica (via fatorP) para o
  // Cenário Base, e a demanda reduzida pelo BESS para cenários com BESS.
  // → Usar maxP_mes para TODOS os cenários é correto e consistente.
  // → NÃO usar demMedidaMedia diretamente aqui (já está embutida no perfil).
  const MW2kW = 1000;
  const demEfetP    = maxP_mes;                        // MW — ponto mais alto da ponta simulada
  const demEfetFP   = maxFP_mes;                       // MW — ponto mais alto FP simulada
  const demEfetGlob = maxGlobal_mes;                   // MW — máximo global (Verde)

  let custoDFP=0, custoDemP=0, multa=0;
  if (isAzul) {
    // Fatura: paga o maior entre contratado e medido
    custoDFP  = Math.max(demEfetFP, demContrFP) * MW2kW * (dem_fp||0);
    custoDemP = Math.max(demEfetP,  demContrP)  * MW2kW * (dem_p||0);
    // Multa: 200% da tarifa sobre o excedente acima do contratado
    multa = (Math.max(0, demEfetFP - demContrFP) * MW2kW * (dem_fp||0)
           + Math.max(0, demEfetP  - demContrP)  * MW2kW * (dem_p||0)) * 2;
  } else {
    custoDFP  = Math.max(demEfetGlob, demContrFP) * MW2kW * (dem_unico||0);
    multa = Math.max(0, demEfetGlob - demContrFP) * MW2kW * (dem_unico||0) * 2;
  }

  // ── Ganho de arbitragem PLD ───────────────────────────────
  // SPOT: ganho real = descarrega no pico (pldPonta) e recarrega fora ponta (pldFPDU)
  // ACL:  não há ganho de arbitragem de energia (preço fixo do contrato)
  //       O benefício do BESS no ACL é EXCLUSIVAMENTE via demanda e multa
  const ganhoDescarga  = temContratoACL ? 0 : du.eArb * cal.diasUteis * pldPonta;
  const custoRecarga   = temContratoACL ? 0 : (du.eArb / ef) * cal.diasUteis * pldFPDU;
  const ganhoArbPLD    = Math.max(0, ganhoDescarga - custoRecarga);

  // ── Custo total do cenário ────────────────────────────────
  // Total = (energia + demanda + multa) - ganho de arbitragem PLD
  // O ganho de arbitragem é real: vendemos/economizamos no horário caro e compramos no barato
  const total = custoEnergia + custoDFP + custoDemP + multa - ganhoArbPLD;

  // ── Indicadores de efetividade ────────────────────────────
  // Redução de demanda ponta: diferença entre demanda efetiva antes/depois do BESS
  const demPontaSemBESS  = demMedidaMediaP || (cargaMedia * PERFIL_DU[19]);
  const reducaoDemandaP  = bessCapMWh > 0 ? Math.max(0, demPontaSemBESS - maxP_mes) : 0;
  const coberturaContrat = demContrP > 0
    ? Math.min(100, (1 - Math.max(0, maxP_mes - demContrP) / demContrP) * 100) : 100;

  const { diasUteis, diasFds, diasNoMes, horasPontaMes, horasFPDU, horasFPFDS } = cal;

  return {
    horasDU:  du.horas,
    horasFDS: fds.horas,
    eFP_mes, eP_mes, eGer_mes, eArb_mes,
    maxFP: maxFP_mes, maxP: maxP_mes, maxGlobal: maxGlobal_mes,
    demEfetP, demEfetFP,  // demanda efetiva usada no faturamento
    ciclosMes, reducaoDemandaP, coberturaContrat,
    pFP, pP, pFDS, pldPonta, pldFPDU, pldFDS, temContratoACL: !!temContratoACL,
    ganhoArbPLD, ganhoDescarga, custoRecarga,
    cal: { diasUteis, diasFds, diasNoMes, horasPontaMes, horasFPDU, horasFPFDS },
    custos:{ energia:custoEnergia, demandaFP:custoDFP, demandaP:custoDemP,
             multa, arbPLD: -ganhoArbPLD, total },
  };
}

// INTEGRAÇÕES VIA CLAUDE API
// ═══════════════════════════════════════════════════════════
async function callClaude(prompt, systemPrompt, fileBase64=null, mediaTipo=null) {
  let content;
  if (fileBase64) {
    // PDF → document block; imagens → image block
    const isPdf = (mediaTipo||"").includes("pdf");
    const fileBlock = isPdf
      ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data:fileBase64 } }
      : { type:"image",    source:{ type:"base64", media_type:mediaTipo||"image/jpeg", data:fileBase64 } };
    content = [ fileBlock, { type:"text", text:prompt } ];
  } else {
    content = prompt;
  }

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:2000,
      system: systemPrompt ||
        "Você é um especialista em mercado de energia elétrica brasileiro. Responda APENAS com JSON válido, sem markdown, sem texto extra. Nunca use undefined, sempre use null para valores desconhecidos.",
      messages:[{ role:"user", content }]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  const txt = data.content?.find(b=>b.type==="text")?.text || "";
  return txt;
}

// Buscar PLD horário real da CCEE — CSV público por ano
// Roda no browser (fetch direto, sem proxy) calculando médias reais
// ponta = horas 18,19,20 de dias úteis (seg-sex)
// fora ponta = demais horas de dias úteis + todos os fins de semana
async function buscarPLDCCEE(submercado) {
  const hoje = new Date();
  const anoAtual = hoje.getFullYear();
  const anoAnterior = anoAtual - 1;

  // URLs dos CSVs públicos da CCEE (um por ano)
  // CORS aberto — funciona direto do browser
  const CSV_URLS = {
    2024: "https://dadosabertos.ccee.org.br/dataset/pld_horario/resource/1b5b6946-8036-4622-a7a3-b21f33fc52b7/download/pld_horario_2024.csv",
    2025: "https://dadosabertos.ccee.org.br/dataset/pld_horario/resource/2a180a6b-f092-43eb-9f82-a48798b803dc/download/pld_horario_2025.csv",
    2026: "https://dadosabertos.ccee.org.br/dataset/pld_horario/resource/3f279d6b-1069-42f7-9b0a-217b084729c4/download/pld_horario_2026.csv",
  };

  // Tenta buscar CSV do ano atual, fallback para ano anterior
  async function fetchCSV(ano) {
    const url = CSV_URLS[ano];
    if (!url) return null;
    try {
      const r = await fetch(url, { cache: "force-cache" });
      if (!r.ok) return null;
      return await r.text();
    } catch { return null; }
  }

  // Parseia CSV da CCEE e retorna array de { data, hora, submercado, pld }
  // Formato típico: data_referencia;hora;id_submercado;val_pld  (separador ; ou ,)
  function parseCSV(txt, sub) {
    if (!txt) return [];
    const lines = txt.trim().split(/\r?\n/);
    const header = lines[0].toLowerCase();
    // Detecta separador
    const sep = header.includes(";") ? ";" : ",";
    const cols = header.split(sep).map(c => c.trim().replace(/"/g,""));

    // Mapeia colunas por nome (flexível para variações do CCEE)
    const iData = cols.findIndex(c => c.includes("data") || c.includes("dat_ref"));
    const iHora = cols.findIndex(c => c.includes("hora") || c.includes("hre"));
    const iSub  = cols.findIndex(c => c.includes("submercado") || c.includes("id_sub") || c.includes("nom_sub"));
    const iPLD  = cols.findIndex(c => c.includes("pld") || c.includes("val_pld") || c.includes("preco"));

    if (iData < 0 || iHora < 0 || iPLD < 0) {
      console.warn("CCEE CSV: colunas não encontradas", cols);
      return [];
    }

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(sep).map(c => c.trim().replace(/"/g,""));
      if (parts.length < 3) continue;

      // Filtra submercado se coluna disponível
      if (iSub >= 0) {
        const s = parts[iSub]?.toUpperCase();
        if (!s.includes(sub.toUpperCase()) && s !== sub.toUpperCase()) continue;
      }

      const rawData = parts[iData] || "";
      const hora    = parseInt(parts[iHora]) || 0;
      const pld     = parseFloat((parts[iPLD]||"0").replace(",","."));
      if (isNaN(pld) || pld <= 0) continue;

      // Parseia data (aceita dd/mm/yyyy ou yyyy-mm-dd)
      let date;
      if (rawData.includes("/")) {
        const [d,m,y] = rawData.split("/");
        date = new Date(+y, +m-1, +d);
      } else {
        date = new Date(rawData);
      }
      if (isNaN(date.getTime())) continue;

      rows.push({ date, hora, pld });
    }
    return rows;
  }

  // Calcula médias dos últimos 3 meses com separação ponta/fora-ponta/fds
  function calcularMedias(rows) {
    const hoje = new Date();
    const limite = new Date(hoje);
    limite.setMonth(limite.getMonth() - 3);

    // Agrupa por mês para o detalhe mensal
    const porMes = {};
    let totalP=0, cntP=0, totalFP=0, cntFP=0, totalFDS=0, cntFDS=0;

    for (const r of rows) {
      if (r.date < limite || r.date > hoje) continue;

      const dow = r.date.getDay(); // 0=dom, 6=sab
      const isFDS = (dow === 0 || dow === 6);
      const isPonta = !isFDS && (r.hora === 18 || r.hora === 19 || r.hora === 20);

      const mesKey = `${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,"0")}`;
      if (!porMes[mesKey]) porMes[mesKey] = { P:[], FP:[], FDS:[] };

      if (isFDS) {
        porMes[mesKey].FDS.push(r.pld);
        totalFDS += r.pld; cntFDS++;
      } else if (isPonta) {
        porMes[mesKey].P.push(r.pld);
        totalP += r.pld; cntP++;
      } else {
        porMes[mesKey].FP.push(r.pld);
        totalFP += r.pld; cntFP++;
      }
    }

    const avg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
    const pldPonta   = cntP   > 0 ? totalP/cntP     : 0;
    const pldFPDU    = cntFP  > 0 ? totalFP/cntFP   : 0;
    const pldFDS_val = cntFDS > 0 ? totalFDS/cntFDS : pldFPDU * 0.85;
    const pldMedio   = (totalP+totalFP+totalFDS) / Math.max(1, cntP+cntFP+cntFDS);
    const spread     = pldFPDU > 0 ? ((pldPonta/pldFPDU)-1)*100 : 0;

    const meses = Object.entries(porMes)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .slice(0,3)
      .map(([key, v]) => {
        const [y,m] = key.split("-");
        const nomeMes = new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
        return {
          mes: nomeMes,
          medio:      +avg([...v.P,...v.FP,...v.FDS]).toFixed(2),
          ponta:      +avg(v.P).toFixed(2),
          fora_ponta: +avg(v.FP).toFixed(2),
          fds:        +avg(v.FDS).toFixed(2),
          horas_ponta: v.P.length,
        };
      });

    return { pldMedio, pldPonta, pldFPDU, pldFDS: pldFDS_val, spread, meses,
             totalHoras: cntP+cntFP+cntFDS, cntP, cntFP, cntFDS };
  }

  // ── Execução principal ─────────────────────────────────────
  // Tenta ano atual + anterior para garantir 3 meses de dados
  let rows = [];
  const csv1 = await fetchCSV(anoAtual);
  if (csv1) rows = parseCSV(csv1, submercado);

  // Se não tem dados suficientes no ano atual, busca anterior também
  if (rows.length < 500) {
    const csv0 = await fetchCSV(anoAnterior);
    if (csv0) rows = [...parseCSV(csv0, submercado), ...rows];
  }

  if (rows.length === 0) {
    throw new Error("Não foi possível obter dados do CSV da CCEE. Verifique sua conexão.");
  }

  const m = calcularMedias(rows);

  return {
    submercado,
    pld_medio_3m:      +m.pldMedio.toFixed(2),
    pld_ponta_3m:      +m.pldPonta.toFixed(2),
    pld_fora_ponta_3m: +m.pldFPDU.toFixed(2),
    pld_fds_3m:        +m.pldFDS.toFixed(2),
    spread_ponta_fp_pct: +m.spread.toFixed(1),
    meses: m.meses,
    horas_analisadas: m.totalHoras,
    horas_ponta: m.cntP,
    fonte: `CCEE PLD Horário ${anoAnterior}–${anoAtual} · ${m.totalHoras.toLocaleString("pt-BR")} obs · Calculado no browser`,
  };
}


// Ler fatura PDF e extrair premissas
async function lerFaturaPDF(base64Data, mediaType) {
  const sys = `Você é especialista em faturas de energia elétrica do Brasil (distribuidoras ANEEL).
Sua única função é extrair dados estruturados de faturas e retornar JSON válido.

REGRAS ABSOLUTAS:
- Retorne SOMENTE o objeto JSON, sem nenhum texto antes ou depois
- Nunca use undefined — use null para campos não encontrados
- Demandas em kW, energias em MWh, tarifas em R$/kW ou R$/MWh

═══ COMO IDENTIFICAR A MODALIDADE TARIFÁRIA (CRÍTICO) ═══

TARIFA AZUL → possui DUAS linhas de demanda separadas na fatura:
  • "Demanda Fora Ponta" (ou "Dem FP", "TUSD Demanda FP") com seu preço unitário
  • "Demanda Ponta" (ou "Dem P", "TUSD Demanda Ponta") com preço unitário DIFERENTE e mais caro
  Palavras-chave: "Azul", "AZUL", "Dem Ponta", "Demanda Ponta", "DP", "DFP"
  → modalidade = "azul"
  → dem_fp_tarifa = preço unitário da demanda fora ponta (R$/kW)
  → dem_p_tarifa  = preço unitário da demanda ponta (R$/kW)
  → dem_unico_tarifa = null

TARIFA VERDE → possui UMA única linha de demanda na fatura:
  • "Demanda" (sem distinção ponta/fora ponta), ou "TUSD Demanda"
  Palavras-chave: "Verde", "VERDE", "Demanda Única", "DU"
  → modalidade = "verde"
  → dem_unico_tarifa = preço unitário da demanda única (R$/kW)
  → dem_fp_tarifa = null
  → dem_p_tarifa  = null

REGRA DE OURO: Se a fatura cobrar demanda com dois preços unitários distintos
(um para ponta e outro para fora ponta) → É AZUL, independente do que estiver escrito.
Se cobrar demanda com um único preço → É VERDE.

═══ TARIFAS UNITÁRIAS (CRÍTICO) ═══
Cada linha de faturamento tem: DESCRIÇÃO | QUANTIDADE | PREÇO UNITÁRIO | VALOR TOTAL
Você deve extrair SOMENTE o PREÇO UNITÁRIO — NUNCA o valor total.

Exemplo CORRETO:
  "TUSD Energia FP | 850 MWh | R$ 185,40/MWh | R$ 157.590,00"
  → tusd_fp = 185.40 ✅   NÃO 157590 ❌

  "TUSD Demanda FP | 5.000 kW | R$ 22,50/kW | R$ 112.500,00"
  → dem_fp_tarifa = 22.50 ✅   NÃO 112500 ❌

Faixas de sanidade (se fora disso, você pegou o total, não o unitário):
- te_fp, tusd_fp: R$ 30–500/MWh
- te_p, tusd_p: R$ 50–1500/MWh
- dem_fp_tarifa: R$ 5–100/kW
- dem_p_tarifa: R$ 10–200/kW
- dem_unico_tarifa: R$ 5–80/kW`;

  const prompt = `Analise esta fatura de energia elétrica com máxima atenção.

PASSO 1 — IDENTIFICAR MODALIDADE:
- Duas cobranças de demanda com preços distintos (ponta ≠ FP) → modalidade = "azul"
- Uma única cobrança de demanda → modalidade = "verde"
Procure também as palavras "Azul", "Verde", "Modalidade" no cabeçalho.

PASSO 2 — EXTRAIR TODOS OS CAMPOS ABAIXO:

A) IDENTIFICAÇÃO:
- distribuidora: nome da distribuidora
- subgrupo: "A3a" (≥88kV) | "A4" (2,3–25kV) | "AS" (subterrânea)
- modalidade: "azul" | "verde"
- mes_referencia: mês/ano da fatura (ex: "JUL/2025")
- dias_faturamento: número de dias do período (ex: 31)

B) DEMANDAS (em kW):
- demanda_contratada_fp_kw: demanda CONTRATADA Fora Ponta
- demanda_contratada_p_kw: demanda CONTRATADA Ponta
- demanda_medida_fp_kw: demanda MEDIDA/REGISTRADA Fora Ponta (valor real medido no mês)
- demanda_medida_p_kw: demanda MEDIDA/REGISTRADA Ponta (valor real medido no mês)
- ultrapassagem_fp_kw: kW excedente na Fora Ponta (medida - contratada, se positivo)
- ultrapassagem_p_kw: kW excedente na Ponta (medida - contratada, se positivo)

C) ENERGIA (em MWh):
- consumo_fp_mwh: consumo total Fora Ponta em MWh
- consumo_p_mwh: consumo total Ponta em MWh

D) TARIFAS UNITÁRIAS (PREÇO POR UNIDADE — NÃO O TOTAL):
- te_fp, te_p: Tarifa de Energia FP e Ponta (R$/MWh)
- tusd_fp, tusd_p: TUSD energia FP e Ponta (R$/MWh)
- dem_fp_tarifa, dem_p_tarifa: tarifa de demanda FP e Ponta (R$/kW)
- dem_unico_tarifa: tarifa de demanda única Verde (R$/kW)

E) TOTAIS:
- total_fatura: valor total da fatura (R$)
- valor_multa_ultrapassagem: valor total cobrado de multa por ultrapassagem (R$)

Retorne EXATAMENTE este JSON (null para campos não encontrados):
{"distribuidora":null,"subgrupo":null,"modalidade":null,"mes_referencia":null,"dias_faturamento":30,"demanda_contratada_fp_kw":null,"demanda_contratada_p_kw":null,"demanda_medida_fp_kw":null,"demanda_medida_p_kw":null,"ultrapassagem_fp_kw":0,"ultrapassagem_p_kw":0,"consumo_fp_mwh":null,"consumo_p_mwh":null,"te_fp":null,"te_p":null,"tusd_fp":null,"tusd_p":null,"dem_fp_tarifa":null,"dem_p_tarifa":null,"dem_unico_tarifa":null,"total_fatura":null,"valor_multa_ultrapassagem":0,"observacoes":null}`;

  const txt = await callClaude(prompt, sys, base64Data, mediaType);
  try {
    let clean = txt.replace(/```json|```/g, "").trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (match) clean = match[0];
    clean = clean.replace(/:\s*undefined/g, ":null");
    const parsed = JSON.parse(clean);

    // ── Validação cruzada de modalidade ──────────────────────────────
    // Se veio como "verde" mas tem dem_p_tarifa preenchida → provavelmente é azul
    if (parsed.modalidade === "verde" && parsed.dem_p_tarifa) {
      parsed.modalidade = "azul";
      parsed.observacoes = (parsed.observacoes||"") + " ⚠ Modalidade corrigida de Verde→Azul (dem_p_tarifa detectada).";
    }
    // Se veio como "azul" mas só tem dem_unico_tarifa e sem dem_fp nem dem_p → provavelmente é verde
    if (parsed.modalidade === "azul" && !parsed.dem_fp_tarifa && !parsed.dem_p_tarifa && parsed.dem_unico_tarifa) {
      parsed.modalidade = "verde";
      parsed.observacoes = (parsed.observacoes||"") + " ⚠ Modalidade corrigida de Azul→Verde (apenas demanda única detectada).";
    }
    // Se modalidade nula mas temos pistas estruturais
    if (!parsed.modalidade) {
      if (parsed.dem_p_tarifa || (parsed.dem_fp_tarifa && parsed.dem_p_tarifa)) parsed.modalidade = "azul";
      else if (parsed.dem_unico_tarifa) parsed.modalidade = "verde";
    }

    // Validação de sanidade: detecta se veio valor total em vez de unitário
    const FAIXAS = {
      te_fp:   [30, 500], te_p:   [50, 1500],
      tusd_fp: [30, 500], tusd_p: [50, 1500],
      dem_fp_tarifa: [5, 100], dem_p_tarifa: [10, 200], dem_unico_tarifa: [5, 80],
    };
    const alertas = [];
    for (const [campo, [min, max]] of Object.entries(FAIXAS)) {
      const v = parsed[campo];
      if (v !== null && v !== undefined && (v < min || v > max)) {
        alertas.push(`${campo}=${v} (fora da faixa ${min}–${max} R$/unidade — provavelmente valor total)`);
        parsed[campo] = null; // zera para forçar preenchimento manual
      }
    }
    if (alertas.length) parsed.observacoes = (parsed.observacoes||"") + " ⚠ Valores rejeitados (possível total em vez de unitário): " + alertas.join("; ");
    return parsed;
  } catch(e) {
    console.error("lerFaturaPDF parse error:", e, "\nRaw:", txt);
    return null;
  }
}

function Tag({ children, color=C.accent }) {
  return <span style={{ background:`${color}18`, color, border:`1px solid ${color}35`,
    borderRadius:3, padding:"2px 8px", fontSize:10, fontWeight:700, letterSpacing:1 }}>{children}</span>;
}

function Spinner({ color=C.accent }) {
  return <span style={{ display:"inline-block", width:14, height:14,
    border:`2px solid ${color}30`, borderTop:`2px solid ${color}`,
    borderRadius:"50%", animation:"spin 0.8s linear infinite" }}/>;
}

function SliderRow({ label, value, min, max, step, onChange, unit, color=C.accent, fmt:fmtFn }) {
  const pct = Math.max(0,Math.min(100,((value-min)/(max-min))*100));
  return (
    <div style={{ marginBottom:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
        <span style={{ color:C.sub, fontSize:11 }}>{label}</span>
        <span style={{ color, fontSize:12, fontWeight:700, fontFamily:"monospace" }}>
          {fmtFn?fmtFn(value):value} {unit}
        </span>
      </div>
      <div style={{ position:"relative" }}>
        <div style={{ height:3, background:C.dim, borderRadius:2 }}>
          <div style={{ height:"100%", width:`${pct}%`, background:color, borderRadius:2 }}/>
        </div>
        <input type="range" min={min} max={max} step={step} value={value}
          onChange={e=>onChange(+e.target.value)}
          style={{ position:"absolute", top:-8, left:0, width:"100%", opacity:0, cursor:"pointer", height:20 }}/>
      </div>
    </div>
  );
}

function KPI({ label, value, unit, color=C.accent, icon, delta, loading }) {
  return (
    <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10,
      padding:"12px 14px", position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:0, right:0, width:50, height:50,
        background:`radial-gradient(circle at top right,${color}15,transparent 70%)` }}/>
      <div style={{ color:C.sub, fontSize:9, letterSpacing:1.5, marginBottom:5, textTransform:"uppercase" }}>{icon} {label}</div>
      <div style={{ color, fontSize:20, fontWeight:700, fontFamily:"monospace", lineHeight:1 }}>
        {loading ? <Spinner color={color}/> : <>{value}<span style={{ fontSize:11, color:C.sub, marginLeft:3 }}>{unit}</span></>}
      </div>
      {delta!==undefined&&!loading&&<div style={{ marginTop:4, fontSize:10, color:delta<=0?C.green:C.red }}>
        {delta<=0?"▼":"▲"} {Math.abs(delta).toFixed(1)}% vs baseline
      </div>}
    </div>
  );
}

function PerfilChart({ horas, pFP, pP, isFDS=false }) {
  if (!horas?.length) return null;
  const W=460, H=130;
  const max = Math.max(...horas.map(d=>Math.max(d.cargaH,d.gerH||0,d.dRede,0.1)));
  const toY = v => H-(v/max)*(H-8)-4;
  const pathOf = key => horas.map((d,i)=>`${i===0?"M":"L"}${i*(W/23)},${toY(d[key]||0)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H+22}`} style={{ width:"100%" }}>
      <defs>
        <linearGradient id="gc3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.accent} stopOpacity="0.22"/><stop offset="100%" stopColor={C.accent} stopOpacity="0.01"/>
        </linearGradient>
        <linearGradient id="gg3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.gold} stopOpacity="0.28"/><stop offset="100%" stopColor={C.gold} stopOpacity="0.01"/>
        </linearGradient>
      </defs>
      {HORAS_PONTA.map(h=><rect key={h} x={h*(W/23)} y={0} width={W/23} height={H} fill={C.red} opacity={0.07}/>)}
      <path d={pathOf("cargaH")+` L${W},${H} L0,${H} Z`} fill="url(#gc3)"/>
      <path d={pathOf("cargaH")} stroke={C.accent} strokeWidth="2" fill="none"/>
      {horas.some(d=>d.gerH>0)&&<>
        <path d={pathOf("gerH")+` L${W},${H} L0,${H} Z`} fill="url(#gg3)"/>
        <path d={pathOf("gerH")} stroke={C.gold} strokeWidth="1.8" fill="none" strokeDasharray="5,3"/>
      </>}
      <path d={pathOf("dRede")} stroke={C.green} strokeWidth="1.5" fill="none"/>
      {horas.some(d=>d.socPct>0)&&<path d={horas.map((d,i)=>`${i===0?"M":"L"}${i*(W/23)},${toY(d.socPct/100*max)}`).join(" ")}
        stroke={C.violet} strokeWidth="1.5" fill="none" strokeDasharray="3,3" opacity={0.8}/>}
      {[0,6,12,18,23].map(h=><text key={h} x={h*(W/23)} y={H+16} fill={C.muted} fontSize="9" textAnchor="middle">{h}h</text>)}
      {isFDS
        ? <text x={W} y={H+16} fill={C.amber} fontSize="9" textAnchor="end">⚠ FIM DE SEMANA — sem ponta tarifária · carga reduzida</text>
        : pFP&&pP&&<text x={W} y={H+16} fill={C.muted} fontSize="9" textAnchor="end">FP R${pFP.toFixed(0)} <tspan fill={C.red}>▐ P R${pP.toFixed(0)}/MWh</tspan></text>
      }
    </svg>
  );
}

function BarrasCusto({ cenarios, isAzul }) {
  // Usa custo bruto (sem subtrair arbitragem) para escala visual, mas mostra o líquido
  const maxBruto = Math.max(...cenarios.map(c=>{
    const cu=c.sim?.custos||{}; return (cu.energia||0)+(cu.demandaFP||0)+(cu.demandaP||0)+(cu.multa||0);
  }), 1);
  return (
    <div style={{ display:"flex", gap:10, alignItems:"flex-end", height:150 }}>
      {cenarios.map((c,i)=>{
        const cu = c.sim?.custos||{};
        const e=cu.energia||0, dFP=cu.demandaFP||0, dP=cu.demandaP||0;
        const m=cu.multa||0, arb=Math.abs(cu.arbPLD||0), total=cu.total||0;
        const bruto = e+dFP+dP+m;
        const cor=CORES[i];
        const hBruto = (bruto/maxBruto)*130;
        const hArb   = bruto>0 ? (arb/bruto)*hBruto : 0;
        return (
          <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
            <div style={{ color:cor, fontSize:10, fontWeight:700, fontFamily:"monospace" }}>
              R${(total/1000).toFixed(0)}k
              {arb>0&&<span style={{ color:C.green, fontSize:8, display:"block" }}>-R${(arb/1000).toFixed(0)}k arb</span>}
            </div>
            <div style={{ width:"100%", position:"relative" }}>
              {/* Barra de custo bruto */}
              <div style={{ width:"100%", height:hBruto, display:"flex", flexDirection:"column",
                justifyContent:"flex-end", border:`1px solid ${cor}40`,
                borderRadius:"4px 4px 0 0", overflow:"hidden", minHeight:bruto>0?6:0 }}>
                {m>0&&<div style={{ background:C.red, height:`${(m/bruto)*100}%`, minHeight:3 }}/>}
                {dP>0&&<div style={{ background:`${C.blue}90`, height:`${(dP/bruto)*100}%`, minHeight:3 }}/>}
                {dFP>0&&<div style={{ background:`${C.amber}80`, height:`${(dFP/bruto)*100}%`, minHeight:4 }}/>}
                <div style={{ background:`${cor}70`, flex:1 }}/>
              </div>
              {/* Seta verde = ganho arbitragem PLD */}
              {hArb>2&&<div style={{
                position:"absolute", bottom:0, left:"10%", width:"80%", height:hArb,
                background:`${C.green}35`, border:`1px solid ${C.green}70`,
                borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center",
              }}>
                <span style={{ color:C.green, fontSize:8, fontWeight:700 }}>↓ arb</span>
              </div>}
            </div>
            <div style={{ color:C.sub, fontSize:9, textAlign:"center", lineHeight:1.3, maxWidth:70 }}>{c.nome}</div>
          </div>
        );
      })}
    </div>
  );
}
