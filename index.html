// PAINEL: INTEGRAÇÃO DE DADOS
// ═══════════════════════════════════════════════════════════
function PainelIntegracao({ tarifas, setTarifas, modalidade, setModalidade, submercado, setSubmercado,
                             distribuidora, setDistribuidora, pldData, setPldData, onFaturaLida }) {
  const [loadingTarifa, setLoadingTarifa] = useState(false);
  const [loadingPld,    setLoadingPld]    = useState(false);
  const [loadingPdf,    setLoadingPdf]    = useState(false);
  const [subgrupo, setSubgrupo] = useState("A4");
  const [msgT, setMsgT] = useState("");
  const [msgP, setMsgP] = useState("");
  const [msgPdf, setMsgPdf] = useState("");
  const [pldModoManual, setPldModoManual] = useState(false);
  const [pldManual, setPldManual] = useState({ pld_ponta_3m:0, pld_fora_ponta_3m:0, pld_fds_3m:0, pld_medio_3m:0, spread_ponta_fp_pct:0 });
  const pdfInputRef = useRef();

  const isAzul = modalidade === "azul";

  const handleBuscarTarifas = async () => {
    setLoadingTarifa(true); setMsgT("Consultando ANEEL...");
    try {
      const dados = await buscarTarifasANEEL(distribuidora, subgrupo, modalidade);
      if (dados) {
        setTarifas(dados);
        setMsgT(`✅ Tarifas carregadas · Vigência: ${dados.vigencia||"—"}`);
      } else {
        setMsgT("⚠️ Não encontrado — verifique distribuidora/subgrupo");
      }
    } catch(e) { setMsgT("❌ Erro: "+e.message); }
    setLoadingTarifa(false);
  };

  // Auto-fetch PLD ao montar e ao trocar submercado
  const fetchPLD = useCallback(async (sub) => {
    setLoadingPld(true);
    setMsgP("⏳ Buscando PLD horário real da CCEE...");
    try {
      const dados = await buscarPLDCCEE(sub);
      setPldData(dados);
      const ponta = dados.pld_ponta_3m||0, fp = dados.pld_fora_ponta_3m||0, fds = dados.pld_fds_3m||0;
      setMsgP(`✅ CCEE · Ponta: R$${ponta.toFixed(2)} · FP DU: R$${fp.toFixed(2)} · FDS: R$${fds.toFixed(2)}/MWh · ${dados.horas_analisadas?.toLocaleString("pt-BR")||"?"} obs`);
    } catch(e) {
      setMsgP(`⚠️ ${e.message} — verifique conexão`);
    }
    setLoadingPld(false);
  }, []);

  // Busca automática ao montar e ao trocar submercado
  useEffect(() => { fetchPLD(submercado); }, [submercado, fetchPLD]);

  const handlePDF = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setLoadingPdf(true); setMsgPdf(`Lendo fatura: ${file.name}...`);
    try {
      const b64 = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("Falha na leitura"));
        r.readAsDataURL(file);
      });
      const dados = await lerFaturaPDF(b64, file.type||"application/pdf");
      if (dados) {
        // ── Atualizar distribuidora, subgrupo, modalidade ──
        if (dados.distribuidora) setDistribuidora(dados.distribuidora);
        if (dados.modalidade)    setModalidade(dados.modalidade);
        if (dados.subgrupo)      setSubgrupo(dados.subgrupo);

        // ── Atualizar tarifas unitárias ────────────────────
        const t = {};
        if (dados.te_fp)           t.te_fp    = dados.te_fp;
        if (dados.te_p)            t.te_p     = dados.te_p;
        if (dados.tusd_fp)         t.tusd_fp  = dados.tusd_fp;
        if (dados.tusd_p)          t.tusd_p   = dados.tusd_p;
        if (dados.dem_fp_tarifa)   t.dem_fp   = dados.dem_fp_tarifa;
        if (dados.dem_p_tarifa)    t.dem_p    = dados.dem_p_tarifa;
        if (dados.dem_unico_tarifa) t.dem_unico = dados.dem_unico_tarifa;
        if (Object.keys(t).length > 0) setTarifas(prev => ({...prev,...t}));

        // ── Atualizar carga, demandas e cenário baseline ───
        const diasMes = dados.dias_faturamento || 30;

        // Carga média = consumo total ÷ horas reais do período
        const consumoTotal = (dados.consumo_fp_mwh||0) + (dados.consumo_p_mwh||0);
        const cargaEstimada = consumoTotal > 0 ? consumoTotal / (diasMes * 24) : null;

        // Demanda contratada (prioridade: contratada > medida) em MW
        const demFP = (dados.demanda_contratada_fp_kw || dados.demanda_medida_fp_kw || 0) / 1000 || null;
        const demP  = (dados.demanda_contratada_p_kw  || dados.demanda_medida_p_kw  || 0) / 1000 || null;

        // Demanda medida (valor real registrado no medidor) em MW
        // Usada para dimensionar o BESS corretamente
        const demMedidaFP = (dados.demanda_medida_fp_kw || 0) / 1000;
        const demMedidaP  = (dados.demanda_medida_p_kw  || 0) / 1000;

        // Ultrapassagem extraída da fatura (já calculada pela distribuidora)
        const ultrapFP = (dados.ultrapassagem_fp_kw || 0) / 1000; // MW
        const ultrapP  = (dados.ultrapassagem_p_kw  || 0) / 1000; // MW

        // Notifica o App com todos os dados necessários
        if (onFaturaLida) onFaturaLida({
          cargaEstimada, demFP, demP,
          demMedidaFP, demMedidaP,
          ultrapFP, ultrapP,
          modalidade: dados.modalidade,
          dadosBrutos: dados,
        });

        // ── Mensagem de retorno ────────────────────────────
        const alertPdf = dados.observacoes?.includes("⚠") ? " ⚠ Alguns campos rejeitados — revise" : "";
        const camposOk = [
          dados.consumo_fp_mwh   && `Energia FP: ${dados.consumo_fp_mwh.toFixed(0)} MWh`,
          dados.consumo_p_mwh    && `P: ${dados.consumo_p_mwh.toFixed(0)} MWh`,
          demFP                  && `Dem contrat. FP: ${(demFP).toFixed(2)} MW`,
          demP                   && `P: ${(demP).toFixed(2)} MW`,
          demMedidaFP>0          && `Dem medida FP: ${demMedidaFP.toFixed(2)} MW`,
          demMedidaP>0           && `P: ${demMedidaP.toFixed(2)} MW`,
          ultrapP>0              && `⚠ Ultrapass. P: ${(ultrapP*1000).toFixed(0)} kW`,
          ultrapFP>0             && `FP: ${(ultrapFP*1000).toFixed(0)} kW`,
          cargaEstimada          && `Carga média: ~${cargaEstimada.toFixed(2)} MW`,
        ].filter(Boolean).join(" · ");
        setMsgPdf(`✅ ${dados.mes_referencia||""} · R$ ${(dados.total_fatura||0).toLocaleString("pt-BR",{minimumFractionDigits:2})} · ${camposOk}${alertPdf}`);
      } else {
        setMsgPdf("⚠️ Não foi possível extrair dados da fatura");
      }
    } catch(e) { setMsgPdf("❌ Erro: "+e.message); }
    setLoadingPdf(false);
  };

  const fieldStyle = { background:C.card, border:`1px solid ${C.border}`, borderRadius:6,
    padding:"6px 10px", color:C.text, fontFamily:"inherit", fontSize:12, width:"100%" };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>

      {/* ── PDF Fatura ─────────────────────────────── */}
      <div style={{ background:C.surface, border:`1px solid ${C.teal}40`, borderRadius:12, padding:16 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
          <Tag color={C.teal}>📄 FATURA PDF</Tag>
          <span style={{ color:C.sub, fontSize:11 }}>Extração automática de premissas via IA</span>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <button onClick={()=>pdfInputRef.current?.click()} disabled={loadingPdf}
            style={{ padding:"8px 16px", borderRadius:8, background:`${C.teal}20`,
              border:`1px solid ${C.teal}60`, color:C.teal, fontSize:12, fontWeight:600,
              cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
            {loadingPdf?<Spinner color={C.teal}/>:"📤"} {loadingPdf?"Lendo PDF...":"Subir Fatura PDF"}
          </button>
          <input ref={pdfInputRef} type="file" accept=".pdf,image/*" onChange={handlePDF} style={{ display:"none" }}/>
          {msgPdf && <div style={{ color: msgPdf.startsWith("✅")?C.green:msgPdf.startsWith("⚠")?C.amber:C.red,
            fontSize:11, flex:1, lineHeight:1.5 }}>{msgPdf}</div>}
        </div>
        {!msgPdf && <div style={{ color:C.muted, fontSize:10, marginTop:8 }}>
          Suba a fatura em PDF ou imagem — o sistema extrai distribuidora, subgrupo, modalidade,
          tarifas, demandas contratadas e consumo automaticamente.
        </div>}
      </div>

      {/* ── Tarifas ANEEL ──────────────────────────── */}
      <div style={{ background:C.surface, border:`1px solid ${C.blue}40`, borderRadius:12, padding:16 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
          <Tag color={C.blue}>⚡ TARIFAS ANEEL</Tag>
          <span style={{ color:C.sub, fontSize:11 }}>Dados homologados por distribuidora</span>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:10, marginBottom:12 }}>
          <div>
            <div style={{ color:C.sub, fontSize:10, marginBottom:4 }}>DISTRIBUIDORA</div>
            <select value={distribuidora} onChange={e=>setDistribuidora(e.target.value)} style={fieldStyle}>
              {DISTRIBUIDORAS.map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <div style={{ color:C.sub, fontSize:10, marginBottom:4 }}>SUBGRUPO</div>
            <select value={subgrupo} onChange={e=>setSubgrupo(e.target.value)} style={fieldStyle}>
              <option value="A3a">A3a — ≥88kV</option>
              <option value="A4">A4 — 2,3–25kV</option>
              <option value="AS">AS — Subterrânea</option>
            </select>
          </div>
          <div>
            <div style={{ color:C.sub, fontSize:10, marginBottom:4 }}>MODALIDADE</div>
            <div style={{ display:"flex", gap:6 }}>
              {[["azul","🔵 Azul"],["verde","🟢 Verde"]].map(([v,l])=>(
                <button key={v} onClick={()=>setModalidade(v)} style={{
                  flex:1, padding:"6px 4px", borderRadius:7, fontSize:12, fontWeight:600,
                  background:modalidade===v?`${v==="azul"?C.blue:C.green}20`:C.dim,
                  border:`1px solid ${modalidade===v?(v==="azul"?C.blue:C.green):"transparent"}`,
                  color:modalidade===v?(v==="azul"?C.blue:C.green):C.sub,
                }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
        <button onClick={handleBuscarTarifas} disabled={loadingTarifa}
          style={{ padding:"8px 16px", borderRadius:8, background:`${C.blue}20`,
            border:`1px solid ${C.blue}60`, color:C.blue, fontSize:12, fontWeight:600,
            cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
          {loadingTarifa?<Spinner color={C.blue}/>:"🔄"} {loadingTarifa?"Consultando ANEEL...":"Buscar Tarifas ANEEL"}
        </button>
        {msgT&&<div style={{ color:msgT.startsWith("✅")?C.green:msgT.startsWith("⚠")?C.amber:C.red,
          fontSize:11, marginTop:8 }}>{msgT}</div>}

        {/* Tabela de tarifas atuais */}
        {tarifas && (
          <div style={{ marginTop:12, display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:8 }}>
            {[
              ["TE FP", tarifas.te_fp, "R$/MWh", C.sub],
              ["TE Ponta", tarifas.te_p, "R$/MWh", C.red],
              ["TUSD FP", tarifas.tusd_fp, "R$/MWh", C.sub],
              ["TUSD Ponta", tarifas.tusd_p, "R$/MWh", C.red],
              isAzul?["Dem FP", tarifas.dem_fp, "R$/kW", C.amber]:["Dem Única", tarifas.dem_unico, "R$/kW", C.green],
              isAzul?["Dem Ponta", tarifas.dem_p, "R$/kW", C.red]:null,
            ].filter(Boolean).map(([label,val,unit,cor])=>(
              <div key={label} style={{ background:C.card, borderRadius:7, padding:"8px 10px" }}>
                <div style={{ color:C.muted, fontSize:9 }}>{label}</div>
                <div style={{ color:cor, fontFamily:"monospace", fontWeight:700 }}>
                  {val!=null ? `R$ ${(+val).toFixed(2)}` : "—"} <span style={{ fontSize:9, color:C.muted }}>{unit}</span>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Edição manual de tarifas */}
        <details style={{ marginTop:12 }}>
          <summary style={{ color:C.sub, fontSize:11, cursor:"pointer" }}>✏️ Editar tarifas manualmente</summary>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:8, marginTop:10 }}>
            {[
              ["TE FP (R$/MWh)","te_fp"],["TE P (R$/MWh)","te_p"],
              ["TUSD FP (R$/MWh)","tusd_fp"],["TUSD P (R$/MWh)","tusd_p"],
              isAzul?["Dem FP (R$/kW)","dem_fp"]:["Dem Única (R$/kW)","dem_unico"],
              isAzul?["Dem P (R$/kW)","dem_p"]:null,
            ].filter(Boolean).map(([label,key])=>(
              <div key={key}>
                <div style={{ color:C.muted, fontSize:9, marginBottom:3 }}>{label}</div>
                <input type="number" step="0.01"
                  value={tarifas?.[key]||""} placeholder="0.00"
                  onChange={e=>setTarifas(prev=>({...prev,[key]:+e.target.value}))}
                  style={{ ...fieldStyle, width:"100%" }}/>
              </div>
            ))}
          </div>
        </details>
      </div>

      {/* ── PLD CCEE — automático ou manual ─────── */}
      <div style={{ background:C.surface, border:`1px solid ${C.gold}40`, borderRadius:12, padding:16 }}>

        {/* Header com toggle automático/manual */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12, flexWrap:"wrap", gap:8 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <Tag color={C.gold}>📈 PLD CCEE</Tag>
            <span style={{ color:C.sub, fontSize:11 }}>
              {pldModoManual ? "Valores manuais" : "Dados horários reais · últimos 3 meses · automático"}
            </span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            {/* Toggle automático / manual */}
            {[["auto","⚡ Automático"],["manual","✏️ Manual"]].map(([modo,label])=>(
              <button key={modo} onClick={()=>setPldModoManual(modo==="manual")}
                style={{ padding:"4px 12px", borderRadius:6, fontSize:11, fontWeight:600,
                  background: (pldModoManual===(modo==="manual"))?`${C.gold}25`:C.dim,
                  border:`1px solid ${(pldModoManual===(modo==="manual"))?C.gold:"transparent"}`,
                  color:(pldModoManual===(modo==="manual"))?C.gold:C.sub }}>
                {label}
              </button>
            ))}
          </div>
        </div>

        {/* ── MODO AUTOMÁTICO ── */}
        {!pldModoManual && (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10, flexWrap:"wrap" }}>
              <div style={{ color:C.sub, fontSize:10 }}>SUBMERCADO</div>
              <select value={submercado} onChange={e=>setSubmercado(e.target.value)}
                style={{...fieldStyle, width:"auto"}}>
                {["SE","S","NE","N"].map(s=><option key={s} value={s}>{s} — {
                  {SE:"Sudeste/CO",S:"Sul",NE:"Nordeste",N:"Norte"}[s]}</option>)}
              </select>
              {loadingPld && <Spinner color={C.gold}/>}
              <button onClick={()=>fetchPLD(submercado)} disabled={loadingPld} title="Recarregar"
                style={{ padding:"4px 10px", borderRadius:6, background:`${C.gold}15`,
                  border:`1px solid ${C.gold}40`, color:C.gold, fontSize:12, cursor:"pointer" }}>↺</button>
            </div>
            {msgP&&<div style={{ color:msgP.startsWith("✅")?C.green:msgP.startsWith("⚠")?C.amber:C.gold,
              fontSize:11, marginBottom:8 }}>{msgP}</div>}
          </div>
        )}

        {/* ── MODO MANUAL ── */}
        {pldModoManual && (
          <div>
            <div style={{ color:C.muted, fontSize:10, marginBottom:10 }}>
              Informe os valores médios do PLD para o período de análise.
              Ponta = horas 18–21h dias úteis · Fora Ponta = demais horas DU · FDS = fins de semana.
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))", gap:10 }}>
              {[
                ["PLD Ponta (R$/MWh)", "pld_ponta_3m", C.red],
                ["PLD Fora Ponta DU (R$/MWh)", "pld_fora_ponta_3m", C.green],
                ["PLD Fim de Semana (R$/MWh)", "pld_fds_3m", C.sub],
                ["PLD Médio Geral (R$/MWh)", "pld_medio_3m", C.gold],
              ].map(([label, key, cor])=>(
                <div key={key}>
                  <div style={{ color:C.muted, fontSize:9, marginBottom:4 }}>{label}</div>
                  <input type="number" step="0.01" min="0" max="9999"
                    value={pldManual[key]||""}
                    placeholder={key==="pld_fds_3m"?"≈ FP × 0.85":key==="pld_medio_3m"?"calculado auto":"0.00"}
                    onChange={e=>{
                      const val = +e.target.value;
                      setPldManual(prev=>{
                        const next = {...prev, [key]: val};
                        // Auto-calcula médio geral como média ponderada se não editado
                        if (key!=="pld_medio_3m") {
                          const p = next.pld_ponta_3m||0, fp = next.pld_fora_ponta_3m||0, fds = next.pld_fds_3m||(fp*0.85);
                          // Ponderação aproximada: ponta 3h×22DU, FP 21h×22DU, FDS 24h×8FDS
                          const tot = 3*22*p + 21*22*fp + 24*8*fds;
                          const hrs = 3*22 + 21*22 + 24*8;
                          next.pld_medio_3m = hrs>0 ? Math.round((tot/hrs)*100)/100 : 0;
                          next.pld_fds_3m = next.pld_fds_3m || Math.round(fp*0.85*100)/100;
                          next.spread_ponta_fp_pct = fp>0 ? Math.round(((p/fp)-1)*10000)/100 : 0;
                        }
                        return next;
                      });
                      // Aplica imediatamente ao pldData
                      setPldData(prev=>({...(prev||{}), [key]:val,
                        fonte:"Manual",
                        submercado: submercado,
                      }));
                    }}
                    style={{ ...fieldStyle, width:"100%",
                      borderColor: key==="pld_ponta_3m"?`${C.red}60`:key==="pld_fora_ponta_3m"?`${C.green}60`:C.border }}/>
                </div>
              ))}
            </div>
            {/* Botão aplicar manual */}
            <button onClick={()=>{
              const p = pldManual.pld_ponta_3m||0;
              const fp= pldManual.pld_fora_ponta_3m||0;
              const fds = pldManual.pld_fds_3m||(fp*0.85);
              const hrs = 3*22 + 21*22 + 24*8;
              const medio = hrs>0?(3*22*p + 21*22*fp + 24*8*fds)/hrs : (p+fp)/2;
              const spread = fp>0 ? ((p/fp)-1)*100 : 0;
              setPldData({
                submercado, pld_medio_3m:+medio.toFixed(2),
                pld_ponta_3m:p, pld_fora_ponta_3m:fp, pld_fds_3m:fds,
                spread_ponta_fp_pct:+spread.toFixed(1),
                meses:[], horas_analisadas:0, fonte:"Manual",
              });
              setMsgP(`✅ PLD manual aplicado · Ponta: R$${p.toFixed(2)} · FP: R$${fp.toFixed(2)} · Spread: ${spread.toFixed(1)}%`);
            }} style={{ marginTop:12, padding:"7px 16px", borderRadius:8, fontSize:12, fontWeight:600,
              background:`${C.gold}20`, border:`1px solid ${C.gold}60`, color:C.gold, cursor:"pointer" }}>
              ✓ Aplicar valores manuais
            </button>
            {msgP&&msgP.startsWith("✅")&&<div style={{ color:C.green, fontSize:11, marginTop:6 }}>{msgP}</div>}
          </div>
        )}

        {/* KPIs PLD — visíveis em ambos os modos quando dados disponíveis */}
        {pldData?.pld_ponta_3m>0 && (
          <div style={{ marginTop:12 }}>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:8 }}>
              <div style={{ background:C.card, borderRadius:8, padding:"10px 14px", flex:1, minWidth:100 }}>
                <div style={{ color:C.muted, fontSize:9 }}>MÉDIO GERAL</div>
                <div style={{ color:C.gold, fontSize:18, fontWeight:700, fontFamily:"monospace" }}>
                  R$ {(pldData.pld_medio_3m||0).toFixed(2)}<span style={{ fontSize:9, color:C.muted }}>/MWh</span>
                </div>
              </div>
              <div style={{ background:`${C.red}12`, border:`1px solid ${C.red}25`, borderRadius:8, padding:"10px 14px", flex:1, minWidth:100 }}>
                <div style={{ color:C.muted, fontSize:9 }}>PONTA (18–21h DU)</div>
                <div style={{ color:C.red, fontSize:18, fontWeight:700, fontFamily:"monospace" }}>
                  R$ {(pldData.pld_ponta_3m||0).toFixed(2)}<span style={{ fontSize:9, color:C.muted }}>/MWh</span>
                </div>
              </div>
              <div style={{ background:`${C.green}10`, border:`1px solid ${C.green}25`, borderRadius:8, padding:"10px 14px", flex:1, minWidth:100 }}>
                <div style={{ color:C.muted, fontSize:9 }}>FORA PONTA DU</div>
                <div style={{ color:C.green, fontSize:18, fontWeight:700, fontFamily:"monospace" }}>
                  R$ {(pldData.pld_fora_ponta_3m||0).toFixed(2)}<span style={{ fontSize:9, color:C.muted }}>/MWh</span>
                </div>
              </div>
              <div style={{ background:`${C.dim}`, borderRadius:8, padding:"10px 14px", minWidth:90 }}>
                <div style={{ color:C.muted, fontSize:9 }}>FIM DE SEMANA</div>
                <div style={{ color:C.sub, fontSize:18, fontWeight:700, fontFamily:"monospace" }}>
                  R$ {(pldData.pld_fds_3m||(pldData.pld_fora_ponta_3m*0.85)||0).toFixed(2)}<span style={{ fontSize:9, color:C.muted }}>/MWh</span>
                </div>
              </div>
              <div style={{ background:`${C.violet}10`, border:`1px solid ${C.violet}25`, borderRadius:8, padding:"10px 14px", minWidth:80 }}>
                <div style={{ color:C.muted, fontSize:9 }}>SPREAD P/FP</div>
                <div style={{ color:C.violet, fontSize:18, fontWeight:700, fontFamily:"monospace" }}>
                  {(pldData.spread_ponta_fp_pct||0).toFixed(1)}%
                </div>
              </div>
            </div>
            {/* Detalhe mensal — só no modo automático */}
            {!pldModoManual && pldData.meses?.length>0 && (
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {pldData.meses.map((m,i)=>(
                  <div key={i} style={{ background:C.card, borderRadius:8, padding:"8px 12px", flex:1, minWidth:90 }}>
                    <div style={{ color:C.muted, fontSize:9, marginBottom:4 }}>{m.mes}</div>
                    {[["Médio",m.medio,C.gold],["Ponta",m.ponta,C.red],["Fora P.",m.fora_ponta,C.green]].map(([l,v,c])=>(
                      <div key={l} style={{ display:"flex", justifyContent:"space-between", gap:4 }}>
                        <span style={{ color:C.sub, fontSize:9 }}>{l}</span>
                        <span style={{ color:c, fontSize:10, fontWeight:700, fontFamily:"monospace" }}>R${(v||0).toFixed(0)}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
            <div style={{ color:C.muted, fontSize:9, marginTop:6 }}>
              {pldData.fonte}{pldData.horas_analisadas>0&&` · ${pldData.horas_analisadas.toLocaleString("pt-BR")} observações`}
            </div>
          </div>
        )}
      </div>

      {/* ── Dados Mercado Livre ─────────────────────── */}
      <div style={{ background:C.surface, border:`1px solid ${C.violet}40`, borderRadius:12, padding:16 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10, flexWrap:"wrap", gap:8 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <Tag color={C.violet}>⚡ MERCADO LIVRE</Tag>
            <span style={{ color:C.sub, fontSize:11 }}>Contrato ACL bilateral</span>
          </div>
          {/* Toggle: com ou sem contrato */}
          <div style={{ display:"flex", gap:6 }}>
            {[["spot","📊 Spot (PLD)"],["acl","📋 Contrato ACL"]].map(([modo,label])=>(
              <button key={modo} onClick={()=>setTarifas(prev=>({...prev,
                temContratoACL: modo==="acl",
                precoACL: modo==="acl" ? (prev.precoACL||150) : 0,
              }))} style={{
                padding:"4px 12px", borderRadius:6, fontSize:11, fontWeight:600,
                background: (tarifas.temContratoACL===(modo==="acl"))?`${C.violet}25`:C.dim,
                border:`1px solid ${(tarifas.temContratoACL===(modo==="acl"))?C.violet:"transparent"}`,
                color:(tarifas.temContratoACL===(modo==="acl"))?C.violet:C.sub,
              }}>{label}</button>
            ))}
          </div>
        </div>

        {/* MODO SPOT */}
        {!tarifas.temContratoACL && (
          <div style={{ background:`${C.gold}10`, border:`1px solid ${C.gold}25`, borderRadius:8, padding:10 }}>
            <div style={{ color:C.gold, fontSize:11, fontWeight:700, marginBottom:4 }}>
              📊 Exposição total ao PLD horário
            </div>
            <div style={{ color:C.sub, fontSize:10, lineHeight:1.5 }}>
              TE = PLD de cada posto horário · TUSD conforme modalidade
            </div>
            <div style={{ display:"flex", gap:10, marginTop:8, flexWrap:"wrap" }}>
              {[
                ["Energia FP DU", `R$ ${((pldData?.pld_fora_ponta_3m||0)+(tarifas.tusd_fp||0)).toFixed(0)}/MWh`, C.green],
                ["Energia Ponta", `R$ ${((pldData?.pld_ponta_3m||0)+(tarifas.tusd_p||0)).toFixed(0)}/MWh`, C.red],
                ["Energia FDS",   `R$ ${((pldData?.pld_fds_3m||(pldData?.pld_fora_ponta_3m*0.85)||0)+(tarifas.tusd_fp||0)).toFixed(0)}/MWh`, C.sub],
              ].map(([l,v,c])=>(
                <div key={l} style={{ background:C.card, borderRadius:6, padding:"6px 10px" }}>
                  <div style={{ color:C.muted, fontSize:9 }}>{l}</div>
                  <div style={{ color:c, fontSize:13, fontWeight:700, fontFamily:"monospace" }}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* MODO CONTRATO ACL */}
        {tarifas.temContratoACL && (
          <div>
            <div style={{ color:C.muted, fontSize:10, marginBottom:10 }}>
              Preço único do contrato bilateral — substituí a TE em todos os postos.
              A TUSD continua sendo paga conforme modalidade (FP e Ponta separadas no Azul).
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:10 }}>
              <div>
                <div style={{ color:C.sub, fontSize:10, marginBottom:4 }}>PREÇO CONTRATO (R$/MWh)</div>
                <input type="number" step="0.01" min="0" max="9999"
                  value={tarifas.precoACL||""}
                  placeholder="ex: 150.00"
                  onChange={e=>setTarifas(prev=>({...prev, precoACL:+e.target.value}))}
                  style={{ ...fieldStyle, width:"100%", borderColor:`${C.violet}60` }}/>
              </div>
              <div>
                <div style={{ color:C.sub, fontSize:10, marginBottom:4 }}>VOLUME CONTRATO (MWh/mês)</div>
                <input type="number" step="1" min="0"
                  value={tarifas.volumeACL||""}
                  placeholder="0 = total da carga"
                  onChange={e=>setTarifas(prev=>({...prev, volumeACL:+e.target.value}))}
                  style={{ ...fieldStyle, width:"100%", borderColor:`${C.violet}60` }}/>
                <div style={{ color:C.muted, fontSize:9, marginTop:3 }}>0 = cobertura total da carga</div>
              </div>
            </div>
            {tarifas.precoACL > 0 && (
              <div style={{ display:"flex", gap:10, marginTop:10, flexWrap:"wrap" }}>
                {[
                  ["Energia FP", `R$ ${((tarifas.precoACL||0)+(tarifas.tusd_fp||0)).toFixed(0)}/MWh`, C.green],
                  ["Energia Ponta", `R$ ${((tarifas.precoACL||0)+(tarifas.tusd_p||0)).toFixed(0)}/MWh`, C.amber],
                  ["Vs. PLD Ponta", `${((tarifas.precoACL||0)-(pldData?.pld_ponta_3m||0)).toFixed(0)} R$/MWh`,
                    (tarifas.precoACL||0)<(pldData?.pld_ponta_3m||0)?C.green:C.red],
                ].map(([l,v,c])=>(
                  <div key={l} style={{ background:C.card, borderRadius:6, padding:"6px 10px" }}>
                    <div style={{ color:C.muted, fontSize:9 }}>{l}</div>
                    <div style={{ color:c, fontSize:13, fontWeight:700, fontFamily:"monospace" }}>{v}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// CONFIG CENÁRIO
// ═══════════════════════════════════════════════════════════
function CenarioConfig({ cenario, index, onChange, baseTotal, isAzul, tarifas, cargaMedia=4, fmtK=v=>`R$ ${(v/1000).toFixed(1)}k`, demandaFP=5, demandaP=2, demMedidaMediaP=null, demMedidaMediaFP=null, setDemMedidaMediaP=()=>{}, setDemMedidaMediaFP=()=>{} }) {
  const cor = CORES[index];
  const isBase = index===0;
  const capexG = cenario.tipoGeracao!=="none"
    ? cenario.potenciaGeracao * (cenario.tipoGeracao==="solar"?3.5:cenario.tipoGeracao==="eolica"?5.0:2.5) * 1e6
    : 0;
  const capexB = capexBESS(cenario.bess.nModulos || 0);
  const capexT = capexG + capexB;
  const economia = baseTotal&&cenario.sim?(baseTotal-cenario.sim.custos.total)*12:0;
  const payback = economia>0&&capexT>0?(capexT/economia).toFixed(1):null;

  return (
    <div style={{ background:C.surface, border:`1px solid ${isBase?C.border:cor+"50"}`, borderRadius:12, padding:16, position:"relative" }}>
      {!isBase&&<div style={{ position:"absolute", top:0, left:0, right:0, height:2,
        background:`linear-gradient(90deg,${cor},transparent)`, borderRadius:"12px 12px 0 0" }}/>}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
        <div>
          <div style={{ color:cor, fontSize:10, fontWeight:700, letterSpacing:1 }}>{isBase?"◆ BASELINE":`◇ CEN. ${index}`}</div>
          <input value={cenario.nome} onChange={e=>onChange({...cenario,nome:e.target.value})}
            style={{ background:"transparent", border:"none", color:C.text, fontSize:14, fontWeight:600, fontFamily:"inherit", padding:0, marginTop:2, width:"100%" }}/>
        </div>
        {cenario.sim&&<div style={{ textAlign:"right" }}>
          <div style={{ color:cor, fontSize:17, fontWeight:700, fontFamily:"monospace" }}>R${(cenario.sim.custos.total/1000).toFixed(1)}k</div>
          <div style={{ color:C.sub, fontSize:9 }}>/mês</div>
          {!isBase&&economia>0&&<div style={{ color:C.green, fontSize:10 }}>-R${(economia/1000).toFixed(0)}k/ano</div>}
        </div>}
      </div>
      {/* Geração */}
      <div style={{ borderTop:`1px solid ${C.dim}`, paddingTop:12, marginBottom:12 }}>
        <div style={{ color:C.sub, fontSize:10, marginBottom:8 }}>⚡ GERAÇÃO PRÓPRIA</div>
        <div style={{ display:"flex", gap:5, marginBottom:10, flexWrap:"wrap" }}>
          {[["none","Nenhuma"],["solar","☀ Solar"],["eolica","💨 Eólica"],["termica","🔥 Térmica"]].map(([tp,lb])=>(
            <button key={tp} onClick={()=>onChange({...cenario,tipoGeracao:tp})} style={{
              flex:1,minWidth:55,padding:"4px 2px",fontSize:10,borderRadius:5,
              background:cenario.tipoGeracao===tp?`${C.gold}20`:C.dim,
              border:`1px solid ${cenario.tipoGeracao===tp?C.gold:"transparent"}`,
              color:cenario.tipoGeracao===tp?C.gold:C.sub,
            }}>{lb}</button>
          ))}
        </div>
        {cenario.tipoGeracao!=="none"&&(
          <div>
            <SliderRow label="Potência instalada" value={cenario.potenciaGeracao}
              min={0.1} max={20} step={0.1} unit="MW" color={C.gold}
              onChange={v=>onChange({...cenario,potenciaGeracao:v})}/>
            {cenario.tipoGeracao==="solar"&&(()=>{
              const horasFP_s = Array.from({length:24},(_,h)=>h).filter(h=>!HORAS_PONTA.includes(h));
              const mPerfilFP_s = horasFP_s.reduce((s,h)=>s+PERFIL_DU[h],0)/horasFP_s.length;
              const fFP_s = demMedidaMediaFP&&mPerfilFP_s>0
                ? demMedidaMediaFP/(cargaMedia*mPerfilFP_s) : 1;
              const modoAtualS = cenario.modoDespacho || "corte_ultrap";

              // Calcula sugestão conforme modo de despacho do BESS
              let potSugerida, descricao, nota;
              if (modoAtualS === "zerar_ponta" && cenario.sim?.eP_mes) {
                // Modo zerar ponta: solar deve cobrir carga FP + recarga do BESS
                const energiaPonta  = (cenario.sim?.eP_mes||0) / ((cenario.sim?.cal?.diasUteis)||22);
                const energiaRecarga = energiaPonta / (cenario.bess?.eficiencia||0.92);
                potSugerida = dimensionarSolarZerarPonta(cargaMedia, fFP_s, energiaRecarga);
                descricao = `☀ Sugerido: ${potSugerida.toFixed(1)} MW para cobrir FP + recarga BESS`;
                nota = "Cobre carga UC + recarga do BESS durante o dia · Picos noturnos: carga natural da UC";
              } else {
                // Modo corte_ultrap: solar para zerar ultrapassagem FP diurna
                potSugerida = dimensionarSolar(cargaMedia, fFP_s, demandaFP);
                descricao = `☀ Sugerido: ${potSugerida.toFixed(1)} MW para zerar ultrap. FP diurna`;
                nota = "Elimina ultrapassagem FP nas horas com sol · Picos noturnos cobertos pelo BESS";
              }

              const jaAdequado = cenario.potenciaGeracao >= potSugerida - 0.05;
              return potSugerida > 0 ? (
                <div style={{ background:`${jaAdequado?C.green:C.gold}12`,
                  border:`1px solid ${jaAdequado?C.green:C.gold}40`,
                  borderRadius:7, padding:"7px 10px", marginTop:6, fontSize:10 }}>
                  <div style={{ color:jaAdequado?C.green:C.gold, fontWeight:700, marginBottom:2 }}>
                    {jaAdequado ? "✅ Solar adequado para o modo configurado" : descricao}
                  </div>
                  <div style={{ color:C.sub, fontSize:9, marginBottom: jaAdequado?0:4 }}>{nota}</div>
                  {!jaAdequado&&(
                    <button onClick={()=>onChange({...cenario,potenciaGeracao:potSugerida})}
                      style={{ padding:"2px 10px", borderRadius:4, fontSize:10,
                        background:`${C.gold}20`, border:`1px solid ${C.gold}60`,
                        color:C.gold, cursor:"pointer" }}>
                      ← Aplicar {potSugerida.toFixed(1)} MW
                    </button>
                  )}
                </div>
              ) : null;
            })()}
          </div>
        )}
      </div>
      {/* BESS */}
      <div style={{ borderTop:`1px solid ${C.dim}`, paddingTop:12, marginBottom:12 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div style={{ color:C.sub, fontSize:10 }}>🔋 BESS — Módulos de {BESS_MODULO.potencia_kw}kW / {BESS_MODULO.capacidade_kwh}kWh</div>
          <div style={{ color:C.muted, fontSize:9 }}>R$ {(BESS_MODULO.capex_reais/1000).toFixed(0)}k/módulo</div>
        </div>
        {/* Modo de despacho */}
        {!isBase&&(
          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
            {[["corte_ultrap","⚡ Cortar ultrapassagem"],["zerar_ponta","🎯 Zerar ponta (100%)"]].map(([modo,label])=>(
              <button key={modo} onClick={()=>onChange({...cenario, modoDespacho:modo})}
                style={{ flex:1, padding:"5px 8px", borderRadius:6, fontSize:10, fontWeight:600,
                  background:(cenario.modoDespacho||"corte_ultrap")===modo?`${C.violet}25`:C.dim,
                  border:`1px solid ${(cenario.modoDespacho||"corte_ultrap")===modo?C.violet:"transparent"}`,
                  color:(cenario.modoDespacho||"corte_ultrap")===modo?C.violet:C.muted }}>
                {label}
              </button>
            ))}
          </div>
        )}

        {/* Seletor de número de módulos */}
        <div style={{ marginBottom:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>

// ─── Especificação do módulo BESS (premissa fixa) ────────────────────────────
const BESS_MODULO = {
  potencia_kw:    125,       // kW por módulo
  capacidade_kwh: 250,       // kWh por módulo (já líquido — sem reserva de segurança)
  capex_reais:    380_000,   // R$ por módulo
  eficiencia:     0.92,      // round-trip efficiency
};
// Helpers de conversão MW (unidade interna) ↔ módulos
const modulos = n => Math.round(n);
const modToMW  = n => n * BESS_MODULO.potencia_kw  / 1000;
const modToMWh = n => n * BESS_MODULO.capacidade_kwh / 1000;
const capexBESS = n => n * BESS_MODULO.capex_reais;

// Dimensiona automaticamente quantos módulos são necessários para cortar
// a ultrapassagem de ponta de um dado cenário de carga.
// demandaBruta_MW = pico de demanda na ponta sem BESS
// demandaContratada_MW = demanda contratada de ponta
// horasPonta = quantas horas de ponta por dia (padrão 3)
function dimensionarBESS(cargaHorasPonta_MWh, demandaContratada_MW, potMaxCorte_MW, ef=0.92) {
  // cargaHorasPonta_MWh: energia total de corte necessária nas horas de ponta (somada)
  // potMaxCorte_MW: pico de potência a cortar (hora mais carregada)
  // ef: eficiência round-trip do BESS
  if (cargaHorasPonta_MWh <= 0 || potMaxCorte_MW <= 0)
    return { nModulos:0, potencia_MW:0, capacidade_MWh:0, capex:0 };

  // Critério 1 — Potência: módulos para atender o pico de corte
  const nModPot  = Math.ceil(potMaxCorte_MW / modToMW(1));

  // Critério 2 — Energia: módulos para armazenar toda a energia necessária
  // (a capacidade líquida deve cobrir o corte total, já que é 100% usável por spec)
  const nModEner = Math.ceil(cargaHorasPonta_MWh / modToMWh(1));

  const nMod = Math.max(nModPot, nModEner);
  return {
    nModulos:      nMod,
    potencia_MW:   modToMW(nMod),
    capacidade_MWh:modToMWh(nMod),
    capex:         capexBESS(nMod),
  };
}

// Dimensiona BESS para ZERAR todo o consumo de ponta (não só ultrapassagem)
function dimensionarBESSZerarPonta(cargaMedia, fatorP, potenciaGeracao=0, tipoGeracao="none") {
  let totalEnergia=0, potMax=0;
  for (const h of HORAS_PONTA) {
    const carga  = cargaMedia * PERFIL_DU[h] * fatorP;
    const gerH   = tipoGeracao==="solar" ? potenciaGeracao*PERFIL_SOLAR[h] : 0;
    const demLiq = Math.max(0, carga - gerH);
    totalEnergia += demLiq;
    potMax = Math.max(potMax, demLiq);
  }
  const nModPot  = Math.ceil(potMax / modToMW(1));
  const nModEner = Math.ceil(totalEnergia / modToMWh(1));
  const nMod = Math.max(nModPot, nModEner);
  return { nModulos:nMod, potencia_MW:modToMW(nMod), capacidade_MWh:modToMWh(nMod),
           capex:capexBESS(nMod), totalEnergia_MWh:totalEnergia, potMax_MW:potMax };
}

// Dimensiona solar para eliminar ultrapassagem FP diurna após BESS
// Encontra a potência solar que nivela o maxFP simulado até demContrFP
// nas horas com geração solar. Picos noturnos precisam de BESS.
function dimensionarSolar(cargaMedia, fatorFP, demContrFP) {
  // Para cada hora FP com sol, calcula pot solar necessária
  // O gargalo é a hora com menor fração solar × maior excedente
  let potMax = 0;
  for (let h = 0; h < 24; h++) {
    if (HORAS_PONTA.includes(h)) continue;
    const carga = cargaMedia * PERFIL_DU[h] * fatorFP;
    const exc   = Math.max(0, carga - demContrFP);
    const frac  = PERFIL_SOLAR[h];
    if (exc > 0 && frac >= 0.15) { // só horas com sol razoável (≥15% do pico)
      potMax = Math.max(potMax, exc / frac);
    }
  }
  return +potMax.toFixed(2); // MW
}

// Dimensiona solar para cobrir carga FP + recarga do BESS no modo zerar_ponta
function dimensionarSolarZerarPonta(cargaMedia, fatorFP, energiaRecarga_MWh) {
  const horasSolares = Array.from({length:24},(_,h)=>h)
    .filter(h => !HORAS_PONTA.includes(h) && PERFIL_SOLAR[h] >= 0.15);
  const pesoTotal = horasSolares.reduce((s,h) => s + PERFIL_SOLAR[h], 0);
  if (pesoTotal === 0 || energiaRecarga_MWh <= 0) return 0;
  let potMax = 0;
  for (const h of horasSolares) {
    const carga    = cargaMedia * PERFIL_DU[h] * fatorFP;
    const pesoH    = PERFIL_SOLAR[h] / pesoTotal;
    const recargaH = energiaRecarga_MWh * pesoH;
    const totalH   = carga + recargaH;
    const potH     = totalH / PERFIL_SOLAR[h];
    potMax = Math.max(potMax, potH);
  }
  return +potMax.toFixed(2);
}

            <span style={{ color:C.gold }}>Gen</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          <Tag color={isAzul?C.blue:C.green}>{isAzul?"🔵 AZUL":"🟢 VERDE"}</Tag>
          <Tag color={C.sub}>{distribuidora}</Tag>
          <Tag color={C.sub}>{submercado}</Tag>
          <Tag color={C.amber}>PLD R${pldAtual.toFixed(0)}{pldData?" (CCEE)":""}</Tag>
          <Tag color={C.dim}>{calAtual.diasUteis}DU · {calAtual.diasFds}FDS · {calAtual.horasPontaMes}h ponta/mês</Tag>
          {econAnual>0&&<Tag color={C.green}>↓ {fmtK(econAnual)}/ano</Tag>}
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(128px,1fr))", gap:8, marginBottom:14 }}>
                <KPI label="Cenário Base" value={fmtK(base.sim?.custos.total)} unit="/mês" color={C.muted} icon="📋"/>
        <KPI label="Melhor Cenário" value={fmtK(melhor.sim?.custos.total)} unit="/mês" color={C.green} icon="✅"
          delta={base.sim&&melhor.sim?((melhor.sim.custos.total-base.sim.custos.total)/base.sim.custos.total*100):undefined}/>
        <KPI label="Economia Anual" value={fmtK(econAnual)} unit="/ano" color={C.gold} icon="💰"/>
        <KPI label={isAzul?"Dem. P Max":"Dem. Global Max"}
          value={(isAzul?sel.sim?.maxP:sel.sim?.maxGlobal)?.toFixed(1)||"—"} unit="MW" color={C.red} icon="⚡"/>
        <KPI label="Ganho Arb. PLD" value={fmtK(sel.sim?.ganhoArbPLD||0)} unit="/mês" color={C.green} icon="⚡"/>
        <KPI label="Arb. energia" value={(sel.sim?.eArb_mes||0).toFixed(0)} unit="MWh/mês" color={C.violet} icon="🔄"/>
        <KPI label="Multa" value={fmtK(sel.sim?.custos.multa||0)} unit="/mês"
          color={(sel.sim?.custos.multa||0)>0?C.red:C.green} icon="⚠️"/>
      </div>

      {/* ABAS */}
      <div style={{ display:"flex", gap:8, marginBottom:14, overflowX:"auto", paddingBottom:2 }}>
        {[["dados","🔌 Dados & Integração"],["overview","▦ Overview"],["detalhe","◉ Perfil Horário"],["cenarios","⚙ Cenários"]].map(([k,l])=>(
          <button key={k} onClick={()=>setView(k)} style={{
            padding:"7px 16px", borderRadius:8, fontSize:12, fontWeight:600, whiteSpace:"nowrap",
            background:view===k?C.accent:C.card, border:`1px solid ${view===k?C.accent:C.border}`,
            color:view===k?C.bg:C.sub,
          }}>{l}</button>
        ))}
      </div>

      {/* ── ABA DADOS ─────────────────────────────── */}
      {view==="dados"&&(
        <PainelIntegracao tarifas={tarifas} setTarifas={setTarifas}
          modalidade={modalidade} setModalidade={setModalidade}
          submercado={submercado} setSubmercado={setSubmercado}
          distribuidora={distribuidora} setDistribuidora={setDistribuidora}
          pldData={pldData} setPldData={setPldData}
          onFaturaLida={({ cargaEstimada, demFP, demP, demMedidaFP, demMedidaP,
                             ultrapFP, ultrapP, modalidade: mod, dadosBrutos }) => {
            if (dadosBrutos) setFaturaRaw(dadosBrutos);
            if (mod) setModalidade(mod);
            // Carga média: consumo real ÷ horas do período
            if (cargaEstimada && cargaEstimada > 0) setCargaMedia(+cargaEstimada.toFixed(3));
            // Demanda CONTRATADA global
            if (demFP && demFP > 0) setDemandaFP(+demFP.toFixed(3));
            if (demP  && demP  > 0) setDemandaP(+demP.toFixed(3));
            // Demanda MEDIDA histórica — usada para calcular ultrapassagem real no Cenário Base
            if (demMedidaFP > 0) setDemMedidaMediaFP(+demMedidaFP.toFixed(3));
            if (demMedidaP  > 0) setDemMedidaMediaP(+demMedidaP.toFixed(3));
          }}/>
      )}

      {/* ── ABA OVERVIEW ──────────────────────────── */}
      {view==="overview"&&(
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16 }}>
            <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5, marginBottom:12 }}>CUSTO MENSAL — {isAzul?"AZUL":"VERDE"}</div>
            <BarrasCusto cenarios={sims} isAzul={isAzul}/>
            <div style={{ display:"flex", gap:8, marginTop:10, flexWrap:"wrap" }}>
              {[["Energia",C.accent],["Dem FP",C.amber],...(isAzul?[["Dem P",C.blue]]:[]),["Multa",C.red]].map(([l,c])=>(
                <div key={l} style={{ display:"flex", alignItems:"center", gap:4 }}>
                  <div style={{ width:10,height:10,background:c,borderRadius:2 }}/><span style={{ color:C.sub,fontSize:9 }}>{l}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16, overflowX:"auto" }}>
            <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5, marginBottom:12 }}>BREAKDOWN MENSAL</div>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11, fontFamily:"monospace" }}>
              <thead><tr>
                {["Cenário","Energia",isAzul?"Dem FP":"Dem Única",isAzul?"Dem P":"—","Multa","Arb PLD","TOTAL"].map(h=>(
                  <th key={h} style={{ color:C.muted, textAlign:h==="Cenário"?"left":"right", padding:"3px 4px", fontWeight:500, fontSize:10 }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>{sims.map((c,i)=>(
                <tr key={i} style={{ borderTop:`1px solid ${C.dim}` }}>
                    <td style={{ padding:"6px 4px", color:CORES[i], fontWeight:600 }}>{c.nome}</td>
                    <td style={{ textAlign:"right", padding:"6px 4px" }}>{fmtK(c.sim?.custos.energia)}</td>
                    <td style={{ textAlign:"right", padding:"6px 4px", color:C.amber }}>{fmtK(c.sim?.custos.demandaFP)}</td>
                    <td style={{ textAlign:"right", padding:"6px 4px", color:isAzul?C.blue:C.muted }}>{isAzul?fmtK(c.sim?.custos.demandaP):"—"}</td>
                    <td style={{ textAlign:"right", padding:"6px 4px", color:(c.sim?.custos.multa||0)>0?C.red:C.muted }}>{fmtK(c.sim?.custos.multa)}</td>
                    <td style={{ textAlign:"right", padding:"6px 4px", color:(c.sim?.ganhoArbPLD||0)>0?C.green:C.muted, fontWeight:600 }}>
                      {(c.sim?.ganhoArbPLD||0)>0?`-${fmtK(c.sim.ganhoArbPLD)}`:"—"}
                    </td>
                    <td style={{ textAlign:"right", padding:"6px 4px", color:CORES[i], fontWeight:700 }}>{fmtK(c.sim?.custos.total)}</td>
                  </tr>              ))}</tbody>
            </table>
            {/* Fonte do preço de energia */}
            <div style={{ marginTop:8, padding:"6px 10px", background:C.dim, borderRadius:6,
              display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
              <span style={{ color:C.muted, fontSize:9 }}>💡 PREÇO DE ENERGIA:</span>
              {tarifas.temContratoACL
                ? <span style={{ color:C.violet, fontSize:10, fontWeight:600 }}>
                    Contrato ACL · R${(tarifas.precoACL||0).toFixed(0)}/MWh + TUSD
                  </span>
                : pldData?.pld_ponta_3m > 0
                  ? <span style={{ color:C.gold, fontSize:10, fontWeight:600 }}>
                      Spot PLD · FP R${((pldData?.pld_fora_ponta_3m||0)).toFixed(0)} · P R${((pldData?.pld_ponta_3m||0)).toFixed(0)}/MWh + TUSD
                    </span>
                  : <span style={{ color:C.amber, fontSize:10 }}>
                      TE regulada (configure PLD ou contrato ACL na aba Dados)
                    </span>
              }

            </div>
          </div>
          {/* BESS */}
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16 }}>
            <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5, marginBottom:12 }}>BESS — ARBITRAGEM PONTA/FP</div>
            {sims.filter(c=>c.bess.capacidade>0).length===0
              ? <div style={{ color:C.muted, fontSize:12, textAlign:"center", padding:20 }}>Nenhum BESS configurado</div>
              : sims.filter(c=>c.bess.capacidade>0).map((c,i)=>(
                <div key={i} style={{ marginBottom:10, padding:10, background:C.card, borderRadius:8 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ color:C.violet, fontWeight:600, fontSize:12 }}>{c.nome}</span>
                    <span style={{ color:C.sub, fontSize:10 }}>
                      {c.bess.nModulos||0}× módulos · {((c.bess.potencia||0)*1000).toFixed(0)}kW / {((c.bess.capacidade||0)*1000).toFixed(0)}kWh · η{((c.bess.eficiencia||0.92)*100).toFixed(0)}%
                    </span>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6 }}>
                    {[["Arb/dia",`${(c.sim?.eArb_mes||0).toFixed(1)} MWh/mês`,C.violet],
                      ["Arb/mês",`${((c.sim?.eArb_mes||0)*22).toFixed(0)} MWh`,C.violet],
                      ["Valor arb. PLD",fmtK(c.sim?.ganhoArbPLD||0),C.green],
                      ["PLD ponta",`R$ ${(c.sim?.pldPonta||0).toFixed(0)}/MWh`,C.red],
                      ["PLD fora P.",`R$ ${(c.sim?.pldFPDU||0).toFixed(0)}/MWh`,C.green],
                      ["Spread P/FP",`${(c.sim?.pldPonta&&c.sim?.pldFPDU?((c.sim.pldPonta/c.sim.pldFP-1)*100):0).toFixed(0)}%`,C.violet],
                    ].map(([l,v,cor])=>(
                      <div key={l}><div style={{ color:C.muted, fontSize:9 }}>{l}</div>
                        <div style={{ color:cor, fontWeight:700, fontFamily:"monospace", fontSize:12 }}>{v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))
            }
          </div>
          {/* Geração */}
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16 }}>
            <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5, marginBottom:12 }}>GERAÇÃO PRÓPRIA</div>
            {sims.filter(c=>c.tipoGeracao!=="none").length===0
              ? <div style={{ color:C.muted, fontSize:12, textAlign:"center", padding:20 }}>Nenhuma geração configurada</div>
              : sims.filter(c=>c.tipoGeracao!=="none").map((c,i)=>{
                const ac = c.sim?Math.min(100,(c.sim.eGer_mes/(cargaMedia*(c.sim.cal?.diasNoMes||30)*24))*100):0;
                const pFP = (tarifas.te_fp||0)+(tarifas.tusd_fp||0);
                return (
                  <div key={i} style={{ marginBottom:10, padding:10, background:C.card, borderRadius:8 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                      <span style={{ color:C.gold, fontWeight:600 }}>{c.nome}</span>
                      <span style={{ color:C.sub, fontSize:10 }}>{c.tipoGeracao==="solar"?"☀":"💨"} {c.potenciaGeracao}MW</span>
                    </div>
                    <div style={{ marginBottom:6 }}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
                        <span style={{ color:C.sub, fontSize:10 }}>Autoconsumo</span>
                        <span style={{ color:C.gold, fontSize:11, fontWeight:700 }}>{ac.toFixed(1)}%</span>
                      </div>
                      <div style={{ height:3, background:C.dim, borderRadius:2 }}>
                        <div style={{ height:"100%", width:`${ac}%`, background:C.gold, borderRadius:2 }}/>
                      </div>
                    </div>
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:4 }}>
                      {[["Ger/dia",`${(c.sim?.eGer_mes||0).toFixed(1)} MWh`],
                        ["Ger/mês",`${(c.sim?.eGer_mes||0).toFixed(0)} MWh`],
                        ["Economia",fmtK(((c.sim?.eGer_mes||0)*pFP)/1000)],
                      ].map(([l,v])=>(
                        <div key={l}><div style={{ color:C.muted, fontSize:9 }}>{l}</div>
                          <div style={{ color:C.gold, fontWeight:700, fontFamily:"monospace", fontSize:11 }}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })
            }
          </div>
        </div>
      )}

      {/* ── PERFIL HORÁRIO ─────────────────────────── */}
      {view==="detalhe"&&(
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
            {sims.map((c,i)=>(
              <button key={i} onClick={()=>setAba(i)} style={{
                padding:"6px 14px", borderRadius:7, fontSize:12, fontWeight:600,
                background:aba===i?`${CORES[i]}25`:C.card, border:`1px solid ${aba===i?CORES[i]:C.border}`, color:aba===i?CORES[i]:C.sub,
              }}>{c.nome}</button>
            ))}
            <div style={{ marginLeft:"auto", display:"flex", gap:6 }}>
              {[["du","📅 Dia Útil"],["fds","📆 Fim de Semana"]].map(([k,l])=>(
                <button key={k} onClick={()=>setTipoDiaView(k)} style={{
                  padding:"5px 12px", borderRadius:6, fontSize:11, fontWeight:600,
                  background:tipoDiaView===k?`${C.teal}25`:C.card,
                  border:`1px solid ${tipoDiaView===k?C.teal:C.border}`,
                  color:tipoDiaView===k?C.teal:C.sub,
                }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:10 }}>
              <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5 }}>PERFIL 24H — {sel.nome.toUpperCase()}</div>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                {[["Carga",C.accent],["Geração",C.gold],["Dem. Líquida",C.green],["SOC BESS",C.violet]].map(([l,c])=>(
                  <div key={l} style={{ display:"flex", alignItems:"center", gap:4 }}>
                    <div style={{ width:16,height:2,background:c }}/><span style={{ color:C.sub,fontSize:9 }}>{l}</span>
                  </div>
                ))}
              </div>
            </div>
            <PerfilChart horas={tipoDiaView==='fds'?sel.sim?.horasFDS:sel.sim?.horasDU} pFP={sel.sim?.pFP} pP={sel.sim?.pP} isFDS={tipoDiaView==='fds'}/>
          </div>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16, overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11, fontFamily:"monospace", minWidth:560 }}>
              <thead><tr style={{ borderBottom:`1px solid ${C.border}` }}>
                {["H","Período","Carga","Geração","↑BESS","↓BESS","Rede","SOC%","R$/MWh"].map(h=>(
                  <th key={h} style={{ color:C.muted, textAlign:h==="H"||h==="Período"?"left":"right", padding:"4px 6px", fontWeight:500, fontSize:10 }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {(tipoDiaView==='fds'?sel.sim?.horasFDS:sel.sim?.horasDU)?.map(h=>(
                  <tr key={h.h} style={{ borderTop:`1px solid ${C.dim}`, background:h.ehP?`${C.red}06`:"transparent" }}>
                    <td style={{ padding:"5px 6px", color:h.ehP?C.red:C.muted }}>{String(h.h).padStart(2,"0")}h</td>
                    <td style={{ padding:"5px 6px" }}>{h.ehFDS?<Tag color={C.amber}>FDS-FP</Tag>:h.ehP?<Tag color={C.red}>PONTA</Tag>:<Tag color={C.muted}>FP-DU</Tag>}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:C.accent }}>{(h.cargaH||0).toFixed(2)}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:h.geracaoH>0?C.gold:C.muted }}>{(h.gerH||0).toFixed(2)}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:h.cB>0?C.violet:C.muted }}>{(h.cB||0).toFixed(2)}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:h.dB>0?C.green:C.muted }}>{(h.dB||0).toFixed(2)}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:C.text, fontWeight:600 }}>{(h.dRede||0).toFixed(2)}</td>
                    <td style={{ textAlign:"right", padding:"5px 6px" }}>
                      <span style={{ color:h.socPct>50?C.green:h.socPct>20?C.amber:C.red }}>{h.socPct.toFixed(0)}%</span>
                    </td>
                    <td style={{ textAlign:"right", padding:"5px 6px", color:h.ehP?C.red:C.sub }}>
                      {h.ehP
                        ? (sel.sim?.pP||0).toFixed(0)
                        : (sel.sim?.pFP||0).toFixed(0)}
                    </td>
                    <td style={{ textAlign:"right", padding:"5px 6px" }}>
                      {(h.ultrapassagem||0)>0.01
                        ? <span style={{ color:C.red, fontWeight:700 }}>+{(h.ultrapassagem||0).toFixed(2)}</span>
                        : <span style={{ color:C.green }}>✓</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── CENÁRIOS ──────────────────────────────── */}
      {view==="cenarios"&&(
        <div>
          {/* Parâmetros globais da UC — iguais em todos os cenários */}
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:14, marginBottom:12 }}>
        <div style={{ color:C.sub, fontSize:10, letterSpacing:1.5, marginBottom:12 }}>PARÂMETROS GLOBAIS DA UC — iguais em todos os cenários</div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:16 }}>
          <SliderRow label="Carga média" value={cargaMedia} min={0.5} max={30} step={0.1} unit="MW" color={C.accent} onChange={setCargaMedia}/>
          <SliderRow label={isAzul?"Dem. contratada FP":"Dem. contratada (única)"} value={demandaFP} min={0.1} max={30} step={0.1} unit="MW" color={C.amber} onChange={setDemandaFP}/>
          {isAzul&&<SliderRow label="Dem. contratada Ponta" value={demandaP} min={0.1} max={20} step={0.1} unit="MW" color={C.red} onChange={setDemandaP}/>}
          {isAzul&&<SliderRow label="Dem. medida média FP (histórico)" value={demMedidaMediaFP||demandaFP} min={0.1} max={30} step={0.01} unit="MW" color={C.amber}
            fmt={v=>`${v.toFixed(2)}`}
            onChange={v=>setDemMedidaMediaFP(v)}/>}
          {isAzul&&<SliderRow label="Dem. medida média Ponta (histórico)" value={demMedidaMediaP||demandaP} min={0.1} max={20} step={0.01} unit="MW" color={C.red}
            fmt={v=>`${v.toFixed(2)}`}
            onChange={v=>setDemMedidaMediaP(v)}/>}
        </div>
      </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))", gap:12, marginTop:8 }}>
            {sims.map((c,i)=>(
              <CenarioConfig key={i} cenario={sims[i]} index={i}
                onChange={v=>updC(i,v)} baseTotal={i===0?null:sims[0].sim?.custos.total}
                isAzul={isAzul} tarifas={tarifas} cargaMedia={cargaMedia} fmtK={fmtK}
                demandaFP={demandaFP} demandaP={demandaP}
                demMedidaMediaP={demMedidaMediaP} demMedidaMediaFP={demMedidaMediaFP}
                setDemMedidaMediaP={setDemMedidaMediaP} setDemMedidaMediaFP={setDemMedidaMediaFP}/>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
